name: SQL Server 2022 CDC initialization

on:  # yamllint disable-line rule:truthy
  push:
    branches: [main, fix/sqlserver-cdc-initialization]
    paths:
    - 'infra/sqlserver/**'
    - 'scripts/prepare-sqlserver.py'
    - 'scripts/sqlserver_demo.py'
    - 'infra/cdc/fixed_source.py'
    - 'requirements-demo.txt'
    - 'tests/integration/sqlserver_collation/**'
    - '.github/workflows/sqlserver-cdc.yml'
  pull_request:
    paths:
    - 'infra/sqlserver/**'
    - 'scripts/prepare-sqlserver.py'
    - 'scripts/sqlserver_demo.py'
    - 'infra/cdc/fixed_source.py'
    - 'requirements-demo.txt'
    - 'tests/integration/sqlserver_collation/**'
    - '.github/workflows/sqlserver-cdc.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  disposable-sql2022:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      with:
        persist-credentials: false
    - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
      with:
        python-version: '3.12'
    - name: Install existing hash-locked SQL AST test dependencies
      run: python -m pip install --require-hashes -r requirements-dev.lock
    - name: Install existing pinned SQL runtime driver
      run: python -m pip install -r requirements-demo.txt
    - name: Install verified official Go sqlcmd 1.10.0
      shell: bash
      run: |
        set -Eeuo pipefail
        cd "$RUNNER_TEMP"
        curl --fail --location --retry 3 --output sqlcmd.tar.bz2 \
          https://github.com/microsoft/go-sqlcmd/releases/download/v1.10.0/sqlcmd-linux-amd64.tar.bz2
        # Digest from the official v1.10.0 release asset API.
        printf '%s  %s\n' \
          92516d98c63d99b0994de5b61350c91f6915f9b76f139a59039fbcb225c2e987 \
          sqlcmd.tar.bz2 | sha256sum --check
        mkdir sqlcmd-bin
        tar -xjf sqlcmd.tar.bz2 -C sqlcmd-bin
        printf '%s\n' "$RUNNER_TEMP/sqlcmd-bin" >> "$GITHUB_PATH"
    - name: Start a new disposable SQL Server 2022 Developer container
      shell: bash
      run: |
        set -Eeuo pipefail
        fixture_password="$(python -c 'import secrets; print(secrets.token_hex(24)+"Aa1!")')"
        echo "::add-mask::$fixture_password"
        printf 'LAKEHOUSE_FIXTURE_PASSWORD=%s\n' "$fixture_password" >> "$GITHUB_ENV"
        export MSSQL_SA_PASSWORD="$fixture_password"
        # Reuse the isolated SQL fixture pattern: job-local CA and certificate,
        # one volume for this SQL container only, never the host trust store.
        umask 077
        tls=$(mktemp -d "$RUNNER_TEMP/sql-fixture-tls.XXXXXX")
        tls_volume="sql-cdc-fixture-tls-$(openssl rand -hex 8)"
        openssl req -x509 -newkey rsa:2048 -nodes -days 1 \
          -subj '/CN=Disposable SQL fixture CA' \
          -addext basicConstraints=critical,CA:TRUE \
          -addext keyUsage=critical,keyCertSign,cRLSign \
          -keyout "$tls/ca-key.pem" -out "$tls/ca.pem" 2>/dev/null
        openssl req -newkey rsa:2048 -nodes -subj /CN=localhost \
          -keyout "$tls/server-key.pem" -out "$tls/server.csr" 2>/dev/null
        printf '%s\n' 'subjectAltName=DNS:localhost,IP:127.0.0.1' \
          'extendedKeyUsage=serverAuth' > "$tls/extensions"
        openssl x509 -req -in "$tls/server.csr" -CA "$tls/ca.pem" \
          -CAkey "$tls/ca-key.pem" -CAcreateserial -days 1 \
          -extfile "$tls/extensions" -out "$tls/server.pem" 2>/dev/null
        cat > "$tls/mssql.conf" <<'CONFIG'
        [network]
        forceencryption = 1
        tlscert = /fixture-tls/server.pem
        tlskey = /fixture-tls/server-key.pem
        CONFIG
        chmod 0444 "$tls/mssql.conf"
        image=mcr.microsoft.com/mssql/server:2022-latest@sha256:11927f5edc5122658e90b3a80ee36e8aef779310bf771415c1d89271859c73fd
        docker pull "$image"
        docker volume create "$tls_volume" >/dev/null
        printf 'LAKEHOUSE_FIXTURE_TLS_VOLUME=%s\nLAKEHOUSE_FIXTURE_CA=%s\n' \
          "$tls_volume" "$tls/ca.pem" >> "$GITHUB_ENV"
        docker run --rm --pull never --network none --user 0 \
          --entrypoint /bin/sh \
          --mount "type=bind,src=$tls/server-key.pem,dst=/incoming.key,readonly" \
          --mount "type=bind,src=$tls/server.pem,dst=/incoming.pem,readonly" \
          --mount "type=volume,src=$tls_volume,dst=/fixture-tls" "$image" -ec \
          'install -m 0400 -o mssql /incoming.key /fixture-tls/server-key.pem
           install -m 0400 -o mssql /incoming.pem /fixture-tls/server.pem'
        docker run --detach --pull never --name sql-cdc-fixture \
          --publish 127.0.0.1:14333:1433 \
          --env ACCEPT_EULA=Y --env MSSQL_PID=Developer \
          --env MSSQL_AGENT_ENABLED=true --env MSSQL_SA_PASSWORD \
          --mount "type=bind,src=$tls/mssql.conf,dst=/var/opt/mssql/mssql.conf,readonly" \
          --mount "type=volume,src=$tls_volume,dst=/fixture-tls,readonly" "$image"
        docker inspect --format '{{.Image}}' sql-cdc-fixture
        for attempt in {1..60}; do
          if SQLCMDPASSWORD="$fixture_password" sqlcmd \
            -S tcp:127.0.0.1,14333 -U sa -N mandatory -C -b -l 2 \
            -Q 'SET NOCOUNT ON; SELECT 1;' > /dev/null 2>&1; then
            exit 0
          fi
          sleep 2
        done
        exit 1
    - name: Exercise scoped reader runtime on synthetic SQL objects
      run: python tests/integration/sqlserver_collation/scoped_reader.py
    - name: Prove virgin and existing reader/control provisioning
      run: python tests/integration/sqlserver_collation/retained_provisioning.py
    - name: Observe unwrapped transactions and scoped guard candidate
      run: python tests/integration/sqlserver_collation/transaction_probe.py
    - name: Approved conditional initialization acceptance (explicit pending risk)
      if: ${{ !cancelled() }}
      env:
        PYTHONDONTWRITEBYTECODE: '1'
      run: python tests/integration/sqlserver_collation/conditional_acceptance.py
    - name: Dispose only this job's synthetic container
      if: ${{ always() }}
      shell: bash
      run: |
        status=0
        docker rm --force sql-cdc-fixture || status=1
        if [[ -n "${LAKEHOUSE_FIXTURE_TLS_VOLUME:-}" ]]; then
          docker volume rm "$LAKEHOUSE_FIXTURE_TLS_VOLUME" || status=1
        fi
        exit "$status"
