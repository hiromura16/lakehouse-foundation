name: Synthetic CDC contract Kafka and Iceberg

on:  # yamllint disable-line rule:truthy
  pull_request:
    paths:
    - 'contracts/cdc/**'
    - 'infra/cdc/**'
    - 'infra/lakehouse/requirements.lock'
    - 'scripts/cdc_contract.py'
    - 'tests/integration/cdc_contract_iceberg/**'
    - '.github/workflows/cdc-contract-iceberg.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  disposable-contract-storage:
    if: >-
      github.repository == 'hiromura16/lakehouse-foundation'
      && (github.event_name == 'pull_request'
      && github.event.pull_request.head.repo.full_name == github.repository
      || github.event_name == 'workflow_dispatch'
      && github.ref == 'refs/heads/main')
    timeout-minutes: 15
    runs-on: ubuntu-24.04
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      with:
        ref: ${{ github.sha }}
        persist-credentials: false
    - name: Verify the disposable one-table Kafka and Iceberg path
      shell: bash
      run: bash tests/integration/cdc_contract_iceberg/hosted.sh
