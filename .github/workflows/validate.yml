name: Validate public source

on:
  push:
  pull_request:
  workflow_dispatch:

# No repository writes, deployment tokens or company secrets are required.
permissions:
  contents: read

jobs:
  source:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      PYTHONDONTWRITEBYTECODE: '1'
      UV_PYTHON_DOWNLOADS: never
      UV_NO_CONFIG: '1'
    steps:
    # Official stable releases resolved to commits on 2026-11-09.
    - name: Check out complete public history
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        fetch-depth: 0
        persist-credentials: false
    - name: Set up Python
      uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
      with:
        python-version: '3.12'
    - name: Prepare Bash and Zsh syntax checkers
      shell: bash
      run: |
        set -Eeuo pipefail
        if ! command -v zsh >/dev/null 2>&1; then
          sudo apt-get update
          sudo apt-get install --no-install-recommends --yes zsh
        fi
        bash --version
        zsh --version
    - name: Set up pinned uv
      uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
      with:
        version: '0.13.7'
        # Official uv x86_64 Linux archive SHA-256.
        checksum: c5221ff41b7892bfc223543883600125f6a47fe845093e0f5bdff4f359196d83
        enable-cache: false
    - name: Create isolated source-quality environment
      shell: bash
      run: |
        set -Eeuo pipefail
        uv venv --python 3.12 "$RUNNER_TEMP/lakehouse-tools"
        uv pip sync --python "$RUNNER_TEMP/lakehouse-tools/bin/python" \
          --require-hashes requirements-dev.lock
        printf '%s\n' "$RUNNER_TEMP/lakehouse-tools/bin" >> "$GITHUB_PATH"
    - name: Check publishable source and history
      run: python scripts/check-source.py --history
    - name: Check Python imports and formatting
      run: |
        ruff check .
        ruff format --check .
        pycodestyle --max-line-length=79 scripts tests infra
    - name: Check installer and Python syntax without applying configuration
      run: |
        bash -n infra/dokploy/install.sh
        python -m compileall -q scripts infra medallion
    # unittest discovery also includes all Dokploy environment regressions.
    - name: Test source-only generation and publication checks
      run: python -m unittest discover -s tests
    - name: Check monitoring templates and official Prometheus configuration
      run: |
        python scripts/compose_inventory.py --check
        python infra/monitoring/vector/tests/build_fixtures.py --check
        python infra/sail/runner.py plan
        python scripts/monitoring_assets.py --check
        python scripts/validate_observability.py --run
    - name: Check generated report figures and offline gallery
      run: python scripts/render_report_assets.py --check
    - name: Check Markdown roles, manifest and local links
      run: python scripts/documentation.py --check
    - name: Check documented commands with Bash and Zsh without execution
      run: python scripts/shell_examples.py --check
    - name: Check Trino SQL
      run: sqlfluff lint --dialect trino medallion
    - name: Parse fixed SQL Server DDL without a database
      shell: bash
      run: |
        set -Eeuo pipefail
        sql_files=(
          infra/sqlserver/*.sql
          infra/sqlserver/diagnostics/*.sql
          tests/integration/sqlserver_collation/*.sql
        )
        for sql_file in "${sql_files[@]}"; do
          sqlfluff parse --dialect tsql "$sql_file" > /dev/null
        done
    - name: Validate all Compose profiles without starting services
      shell: bash
      run: |
        set -Eeuo pipefail
        docker compose version
        python scripts/configure.py --output "$RUNNER_TEMP/lakehouse-ci-private/site.env"
        python - <<'PY'
        import os
        from pathlib import Path

        root = Path(os.environ['RUNNER_TEMP'])
        landing = root / 'lakehouse-ci-landing'
        landing.mkdir(mode=0o700, exist_ok=True)
        env_file = root / 'lakehouse-ci-private/site.env'
        token_file = root / 'lakehouse-ci-private' / 'openobserve-token.json'
        token_file.write_text('{"token":"o2oi_' + 's' * 32 + '"}\n')
        token_file.chmod(0o600)
        lines = []
        for line in env_file.read_text(encoding='utf-8').splitlines():
            if line.startswith('LANDING_DIR='):
                line = 'LANDING_DIR=' + str(landing)
            if line.startswith('COMPOSE_PROFILES='):
                line = 'COMPOSE_PROFILES=automation,monitoring,compute,orchestration,demo,cdc,bi,notebooks,vector,lineage,mcp,openobserve-lab,sail-lab'
            if line.startswith('OPENOBSERVE_INGEST_TOKEN_FILE='):
                line = 'OPENOBSERVE_INGEST_TOKEN_FILE=' + str(token_file)
            lines.append(line)
        env_file.write_text('\n'.join(lines) + '\n', encoding='utf-8')
        PY
        ./scripts/lakehouse.sh --env-file "$RUNNER_TEMP/lakehouse-ci-private/site.env" plan
        docker compose --env-file "$RUNNER_TEMP/lakehouse-ci-private/site.env" \
          -f infra/lakehouse/compose.yaml \
          -f infra/compute/compose.yaml \
          -f infra/orchestration/compose.yaml \
          -f infra/demo/compose.yaml \
          -f infra/cdc/compose.yaml \
          -f infra/poc/compose.yaml \
          -f infra/mcp/compose.yaml \
          -f infra/openobserve/compose.yaml \
          -f infra/sail/compose.yaml config --quiet
