<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="1080" viewBox="0 0 1920 1080" role="img" aria-labelledby="07-ai-context-title 07-ai-context-description" font-family="Noto Sans CJK JP, Noto Sans JP, Yu Gothic, sans-serif">
<title id="07-ai-context-title">AIへ渡す事実と根拠の境界</title>
<desc id="07-ai-context-description">Trinoが各表のmain snapshotを固定し、上限付きcontext JSONへ表名とsnapshot IDを付ける。LangChain Document化までを同梱し、モデル推論やRAGの完成とは区別する。 根拠: scripts/ai_context.py, examples/ai/context_chain.py, infra/mcp/server.py, docs/verification.json</desc>
<defs>
<marker id="07-ai-context-data" markerWidth="10" markerHeight="10" refX="8" refY="4" orient="auto"><path d="M0,0 L0,8 L9,4 Z" fill="#2469a8"/></marker>
<marker id="07-ai-context-control" markerWidth="10" markerHeight="10" refX="8" refY="4" orient="auto"><path d="M0,0 L0,8 L9,4 Z" fill="#70608e"/></marker>
<marker id="07-ai-context-optional" markerWidth="10" markerHeight="10" refX="8" refY="4" orient="auto"><path d="M0,0 L0,8 L9,4 Z" fill="#78818c"/></marker>
</defs>
<rect x="0" y="0" width="1920" height="1080" rx="0" fill="#fff" stroke="none"/>
<rect x="0" y="0" width="14" height="1080" rx="0" fill="#152a43" stroke="none"/>
<text x="56" y="43" fill="#536780" font-size="18" font-weight="600">LAKEHOUSE FOUNDATION  /  PoC REPORT ASSETS</text>
<text x="56" y="104" fill="#152a43" font-size="42" font-weight="700">07  AIへ渡す事実と根拠の境界</text>
<path d="M1270,35 L1320,35" stroke="#2469a8" stroke-width="3"/>
<text x="1332" y="41" fill="#536780" font-size="17" font-weight="400">データ</text>
<path d="M1475,35 L1525,35" stroke="#70608e" stroke-width="3" stroke-dasharray="8 5"/>
<text x="1537" y="41" fill="#536780" font-size="17" font-weight="400">制御・設定</text>
<path d="M1680,35 L1730,35" stroke="#78818c" stroke-width="3" stroke-dasharray="3 7"/>
<text x="1742" y="41" fill="#536780" font-size="17" font-weight="400">任意・計画</text>
<text x="56" y="148" fill="#536780" font-size="23" font-weight="400">固定Gold2表をmain snapshotで読む。Document化、モデル推論、索引作成を分ける。</text>
<rect x="56" y="220" width="400" height="260" rx="16" fill="#fff7dd" stroke="#dfca85"/>
<rect x="56" y="238" width="5" height="224" rx="2" fill="#806000" stroke="none"/>
<text x="80" y="262" fill="#152a43" font-size="27" font-weight="700">01｜Gold2表</text>
<text x="80" y="307" fill="#152a43" font-size="23" font-weight="400">生産：工場・UTC日別</text>
<text x="80" y="339" fill="#152a43" font-size="23" font-weight="400">出荷：受注別</text>
<text x="80" y="371" fill="#152a43" font-size="23" font-weight="400">SQLで型と指標を確定</text>
<text x="80" y="410" fill="#806000" font-size="20" font-weight="600">任意SQL入力は公開しない</text>
<rect x="520" y="220" width="400" height="260" rx="16" fill="#edf4ff" stroke="#b8cee8"/>
<rect x="520" y="238" width="5" height="224" rx="2" fill="#245fa6" stroke="none"/>
<text x="544" y="262" fill="#152a43" font-size="27" font-weight="700">02｜main snapshot</text>
<image x="855" y="238" width="46" height="46" preserveAspectRatio="xMidYMid meet" href="data:image/svg+xml;base64,"/>
<text x="544" y="307" fill="#152a43" font-size="23" font-weight="400">各表の$refsからmain</text>
<text x="544" y="339" fill="#152a43" font-size="23" font-weight="400">FOR VERSION AS OF</text>
<text x="544" y="371" fill="#152a43" font-size="23" font-weight="400">各表最大500行</text>
<text x="544" y="410" fill="#245fa6" font-size="20" font-weight="600">表間の同時点保証はない</text>
<rect x="984" y="220" width="400" height="260" rx="16" fill="#edf4ff" stroke="#b8cee8"/>
<rect x="984" y="238" width="5" height="224" rx="2" fill="#245fa6" stroke="none"/>
<text x="1008" y="262" fill="#152a43" font-size="27" font-weight="700">03｜context JSON</text>
<text x="1008" y="307" fill="#152a43" font-size="23" font-weight="400">table / snapshot_id / rows</text>
<text x="1008" y="339" fill="#152a43" font-size="23" font-weight="400">complete_dataset:false</text>
<text x="1008" y="371" fill="#152a43" font-size="23" font-weight="400">exporterと参照SQLのhash</text>
<text x="1008" y="410" fill="#245fa6" font-size="20" font-weight="600">全件集計として扱わない</text>
<rect x="1448" y="220" width="416" height="260" rx="16" fill="#f1edfc" stroke="#c6b9e9"/>
<rect x="1448" y="238" width="5" height="224" rx="2" fill="#63449b" stroke="none"/>
<text x="1472" y="262" fill="#152a43" font-size="27" font-weight="700">04｜LangChain</text>
<text x="1472" y="307" fill="#152a43" font-size="23" font-weight="400">Documentへ変換</text>
<text x="1472" y="339" fill="#152a43" font-size="23" font-weight="400">表・snapshotをmetadataへ</text>
<text x="1472" y="371" fill="#152a43" font-size="23" font-weight="400">推論・embeddingとは別操作</text>
<text x="1472" y="410" fill="#63449b" font-size="20" font-weight="600">固定lock / tracing無効</text>
<rect x="56" y="620" width="590" height="220" rx="16" fill="#eaf7f3" stroke="#a4d1c1"/>
<rect x="56" y="638" width="5" height="184" rx="2" fill="#126c59" stroke="none"/>
<text x="80" y="662" fill="#152a43" font-size="27" font-weight="700">MCP｜AIクライアントの入口</text>
<text x="80" y="707" fill="#152a43" font-size="23" font-weight="400">9read tools / 2resourcesが既定</text>
<text x="80" y="739" fill="#152a43" font-size="23" font-weight="400">3write toolsはopt-in＋呼出ごと同意</text>
<text x="80" y="771" fill="#152a43" font-size="23" font-weight="400">HTTP Bearer・Host制限・固定API</text>
<text x="80" y="810" fill="#126c59" font-size="20" font-weight="600">任意SQL・shellは提供しない</text>
<rect x="740" y="620" width="536" height="220" rx="16" fill="#f5f6f8" stroke="#c8cdd5"/>
<rect x="740" y="638" width="5" height="184" rx="2" fill="#586271" stroke="none"/>
<text x="764" y="662" fill="#152a43" font-size="27" font-weight="700">任意のローカル推論</text>
<text x="764" y="707" fill="#152a43" font-size="23" font-weight="400">Ollama接続例を同梱</text>
<text x="764" y="739" fill="#152a43" font-size="23" font-weight="400">モデル導入・推論評価は別途</text>
<text x="764" y="771" fill="#152a43" font-size="23" font-weight="400">原本・snapshotへ戻れる回答を確認</text>
<text x="764" y="810" fill="#586271" font-size="20" font-weight="600">未実機評価 / 選択肢</text>
<rect x="1370" y="620" width="494" height="220" rx="16" fill="#f5f6f8" stroke="#c8cdd5"/>
<rect x="1370" y="638" width="5" height="184" rx="2" fill="#586271" stroke="none"/>
<text x="1394" y="662" fill="#152a43" font-size="27" font-weight="700">RAG / 外部AIの追加</text>
<text x="1394" y="707" fill="#152a43" font-size="23" font-weight="400">OCR / chunk / embedding</text>
<text x="1394" y="739" fill="#152a43" font-size="23" font-weight="400">権限・削除同期・検索評価</text>
<text x="1394" y="771" fill="#152a43" font-size="23" font-weight="400">外部送信・accountは未設定</text>
<text x="1394" y="810" fill="#586271" font-size="20" font-weight="600">追加実装の範囲</text>
