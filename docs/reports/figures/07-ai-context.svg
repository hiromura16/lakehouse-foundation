<rect x="1644" y="481" width="48" height="27" rx="3" fill="#fff" stroke="none"/>
<g text-anchor="middle"><text x="1668" y="500" fill="#78818c" font-size="18" font-weight="600">任意</text></g>
<rect x="56" y="915" width="1808" height="1" rx="0" fill="#d7dfe8" stroke="none"/>
<text x="56" y="950" fill="#536780" font-size="20" font-weight="400">export時SQLのhashは、過去snapshotを生成したSQL版の証明ではない。実行監査台帳は追加課題。</text>
<text x="56" y="977" fill="#536780" font-size="20" font-weight="400">Qdrantの合成vector3点とMarquezの手動系統seedは疎通試験。意味検索精度・実系統自動収集を保証しない。</text>
<text x="56" y="1057" fill="#536780" font-size="17" font-weight="400">公開実装の説明 / 既存検証記録・計画は図内で区別 / 2026-11-11 / 根拠・キャプションは同梱台帳へ</text>
</svg>
