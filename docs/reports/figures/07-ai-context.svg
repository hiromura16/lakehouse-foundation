<path d="M 920,350 L 984,350" fill="none" stroke="#2469a8" stroke-width="3" marker-end="url(#07-ai-context-data)"/>
<path d="M 1384,350 L 1448,350" fill="none" stroke="#2469a8" stroke-width="3" marker-end="url(#07-ai-context-data)"/>
