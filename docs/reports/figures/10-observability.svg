<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="1080" viewBox="0 0 1920 1080" role="img" aria-labelledby="10-observability-title 10-observability-description" font-family="Noto Sans CJK JP, Noto Sans JP, Yu Gothic, sans-serif">
<title id="10-observability-title">監視・状態確認・業務品質を分ける</title>
<desc id="10-observability-description">Prometheusは既存worker/selfにnode/cadvisorを追加する4job定義。host権限とDocker29/cgroupv2の指標・ラベルは別途実機受入が必要。ポータルhealth・品質SQL・実行履歴とは別の観測。 根拠: infra/monitoring/prometheus.yml, scripts/admin.py, scripts/grafana_setup.py, infra/demo/poc_quality.py</desc>
<defs>
<marker id="10-observability-data" markerWidth="10" markerHeight="10" refX="8" refY="4" orient="auto"><path d="M0,0 L0,8 L9,4 Z" fill="#2469a8"/></marker>
<marker id="10-observability-control" markerWidth="10" markerHeight="10" refX="8" refY="4" orient="auto"><path d="M0,0 L0,8 L9,4 Z" fill="#70608e"/></marker>
<marker id="10-observability-optional" markerWidth="10" markerHeight="10" refX="8" refY="4" orient="auto"><path d="M0,0 L0,8 L9,4 Z" fill="#78818c"/></marker>
</defs>
<rect x="0" y="0" width="1920" height="1080" rx="0" fill="#fff" stroke="none"/>
<rect x="0" y="0" width="14" height="1080" rx="0" fill="#152a43" stroke="none"/>
<text x="56" y="43" fill="#536780" font-size="18" font-weight="600">LAKEHOUSE FOUNDATION  /  PoC REPORT ASSETS</text>
<text x="56" y="104" fill="#152a43" font-size="42" font-weight="700">10  監視・状態確認・業務品質を分ける</text>
<path d="M1270,35 L1320,35" stroke="#2469a8" stroke-width="3"/>
<text x="1332" y="41" fill="#536780" font-size="17" font-weight="400">データ</text>
<path d="M1475,35 L1525,35" stroke="#70608e" stroke-width="3" stroke-dasharray="8 5"/>
<text x="1537" y="41" fill="#536780" font-size="17" font-weight="400">制御・設定</text>
<path d="M1680,35 L1730,35" stroke="#78818c" stroke-width="3" stroke-dasharray="3 7"/>
<text x="1742" y="41" fill="#536780" font-size="17" font-weight="400">任意・計画</text>
<text x="56" y="148" fill="#536780" font-size="23" font-weight="400">メトリクス、到達性、業務件数、履歴の4種類を区別する。healthyだけではデータの正しさは分からない。</text>
<rect x="56" y="230" width="420" height="240" rx="16" fill="#edf4ff" stroke="#b8cee8"/>
<rect x="56" y="248" width="5" height="204" rx="2" fill="#245fa6" stroke="none"/>
<text x="80" y="272" fill="#152a43" font-size="27" font-weight="700">worker /metrics</text>
<text x="80" y="317" fill="#152a43" font-size="23" font-weight="400">処理の指標を公開</text>
<text x="80" y="349" fill="#152a43" font-size="23" font-weight="400">DBA・業務照合とは別</text>
<text x="80" y="381" fill="#152a43" font-size="23" font-weight="400">外部host exporterは未同梱</text>
<text x="80" y="420" fill="#245fa6" font-size="20" font-weight="600">メトリクス対象1</text>
<rect x="650" y="230" width="520" height="240" rx="16" fill="#eaf7f3" stroke="#a4d1c1"/>
<rect x="650" y="248" width="5" height="204" rx="2" fill="#126c59" stroke="none"/>
<text x="674" y="272" fill="#152a43" font-size="27" font-weight="700">Prometheus</text>
<image x="1105" y="248" width="46" height="46" preserveAspectRatio="xMidYMid meet" href="data:image/svg+xml;base64,"/>
<text x="674" y="317" fill="#152a43" font-size="23" font-weight="400">worker/self＋node/cadvisorの4job</text>
<text x="674" y="349" fill="#152a43" font-size="23" font-weight="400">scrape interval：15秒</text>
<text x="674" y="381" fill="#152a43" font-size="23" font-weight="400">保存：15日 / 2GBの設定</text>
<text x="674" y="420" fill="#126c59" font-size="20" font-weight="600">monitoring</text>
<rect x="1344" y="230" width="520" height="240" rx="16" fill="#eaf7f3" stroke="#a4d1c1"/>
<rect x="1344" y="248" width="5" height="204" rx="2" fill="#126c59" stroke="none"/>
<text x="1368" y="272" fill="#152a43" font-size="27" font-weight="700">Grafana</text>
<image x="1799" y="248" width="46" height="46" preserveAspectRatio="xMidYMid meet" href="data:image/svg+xml;base64,"/>
<text x="1368" y="317" fill="#152a43" font-size="23" font-weight="400">datasourceはprovision</text>
<text x="1368" y="349" fill="#152a43" font-size="23" font-weight="400">dashboardは初回だけseed</text>
<text x="1368" y="381" fill="#152a43" font-size="23" font-weight="400">GUI編集はDBへ保存し保持</text>
<text x="1368" y="420" fill="#126c59" font-size="20" font-weight="600">monitoring</text>
<rect x="56" y="630" width="420" height="220" rx="16" fill="#edf4ff" stroke="#b8cee8"/>
<rect x="56" y="648" width="5" height="184" rx="2" fill="#245fa6" stroke="none"/>
<text x="80" y="672" fill="#152a43" font-size="27" font-weight="700">到達性 / readiness</text>
<text x="80" y="717" fill="#152a43" font-size="23" font-weight="400">サービス入口カード16種</text>
<text x="80" y="749" fill="#152a43" font-size="23" font-weight="400">起動・未選択・未設定を区別</text>
<text x="80" y="781" fill="#152a43" font-size="23" font-weight="400">healthy≠業務数値の正しさ</text>
<text x="80" y="820" fill="#245fa6" font-size="20" font-weight="600">Streamlit / API</text>
<rect x="650" y="630" width="520" height="220" rx="16" fill="#fff7dd" stroke="#dfca85"/>
<rect x="650" y="648" width="5" height="184" rx="2" fill="#806000" stroke="none"/>
<text x="674" y="672" fill="#152a43" font-size="27" font-weight="700">業務品質</text>
<text x="674" y="717" fill="#152a43" font-size="23" font-weight="400">固定6表のBronze/Silver/隔離件数</text>
<text x="674" y="749" fill="#152a43" font-size="23" font-weight="400">Gold previewは表ごと上限付き</text>
<text x="674" y="781" fill="#152a43" font-size="23" font-weight="400">会社期待値は同じ範囲で照合</text>
<text x="674" y="820" fill="#806000" font-size="20" font-weight="600">catalog / quality / verify</text>
<rect x="1344" y="630" width="520" height="220" rx="16" fill="#f1edfc" stroke="#c6b9e9"/>
<rect x="1344" y="648" width="5" height="184" rx="2" fill="#63449b" stroke="none"/>
<text x="1368" y="672" fill="#152a43" font-size="27" font-weight="700">履歴 / 監査</text>
<text x="1368" y="717" fill="#152a43" font-size="23" font-weight="400">n8n・Airflow・Sparkは各保存先</text>
<text x="1368" y="749" fill="#152a43" font-size="23" font-weight="400">API job20件はメモリ内だけ</text>
<text x="1368" y="781" fill="#152a43" font-size="23" font-weight="400">通知・全ログ・長期監査は追加課題</text>
<text x="1368" y="820" fill="#63449b" font-size="20" font-weight="600">Alloy / Loki等は未導入</text>
<path d="M 476,350 L 650,350" fill="none" stroke="#2469a8" stroke-width="3" marker-end="url(#10-observability-data)"/>
<rect x="501.56" y="316" width="122.88" height="27" rx="3" fill="#fff" stroke="none"/>
<g text-anchor="middle"><text x="563" y="335" fill="#2469a8" font-size="18" font-weight="600">HTTP scrape</text></g>
<path d="M 1170,350 L 1344,350" fill="none" stroke="#2469a8" stroke-width="3" marker-end="url(#10-observability-data)"/>
<rect x="1202.76" y="316" width="108.48" height="27" rx="3" fill="#fff" stroke="none"/>
<g text-anchor="middle"><text x="1257" y="335" fill="#2469a8" font-size="18" font-weight="600">PromQL参照</text></g>
<rect x="56" y="915" width="1808" height="1" rx="0" fill="#d7dfe8" stroke="none"/>
<text x="56" y="950" fill="#536780" font-size="20" font-weight="400">GUI入口カードの数とPrometheus target数は別。会社SQL Server・DB・Kafka・ホスト全体の監視は追加する。</text>
<text x="56" y="977" fill="#536780" font-size="20" font-weight="400">Grafana JSON exportはdashboard単体。利用者・権限・全設定の復元はDBと設定のバックアップで確認する。</text>
<text x="56" y="1057" fill="#536780" font-size="17" font-weight="400">公開実装の説明 / 既存検証記録・計画は図内で区別 / 2026-11-11 / 根拠・キャプションは同梱台帳へ</text>
</svg>
