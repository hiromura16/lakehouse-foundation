<path d="M 984,745 L 920,745" fill="none" stroke="#70608e" stroke-width="3" stroke-dasharray="8 5" marker-end="url(#11-deployment-lifecycle-control)"/>
<path d="M 520,745 L 456,745" fill="none" stroke="#70608e" stroke-width="3" stroke-dasharray="8 5" marker-end="url(#11-deployment-lifecycle-control)"/>
<rect x="56" y="915" width="1808" height="1" rx="0" fill="#d7dfe8" stroke="none"/>
<text x="56" y="950" fill="#536780" font-size="20" font-weight="400">7Composeの標準Commandは初回から使用可能。起動対象はCOMPOSE_PROFILESで段階追加する。</text>
<text x="56" y="977" fill="#536780" font-size="20" font-weight="400">CLIかDokployの管理入口を一つに決める。private envとDokployサービスenvは管理者が同期して再配置する。</text>
<text x="56" y="1057" fill="#536780" font-size="17" font-weight="400">公開実装の説明 / 既存検証記録・計画は図内で区別 / 2026-11-10 / 根拠・キャプションは同梱台帳へ</text>
