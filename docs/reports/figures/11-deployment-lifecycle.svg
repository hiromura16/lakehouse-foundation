<marker id="11-deployment-lifecycle-optional" markerWidth="10" markerHeight="10" refX="8" refY="4" orient="auto"><path d="M0,0 L0,8 L9,4 Z" fill="#78818c"/></marker>
</defs>
<rect x="0" y="0" width="1920" height="1080" rx="0" fill="#fff" stroke="none"/>
