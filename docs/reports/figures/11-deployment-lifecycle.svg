<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="1080" viewBox="0 0 1920 1080" role="img" aria-labelledby="11-deployment-lifecycle-title 11-deployment-lifecycle-description" font-family="Noto Sans CJK JP, Noto Sans JP, Yu Gothic, sans-serif">
<title id="11-deployment-lifecycle-title">公開Gitから配置・反映する手順</title>
<desc id="11-deployment-lifecycle-description">ホスト準備とprivate設定を行い、生成後appNameへCompose名を合わせる。Composeサービス自身のEnvironmentを保存し、Git Providerと7ファイルCommandからDeployする。GUI保存だけでは反映しない。 根拠: infra/dokploy/install.sh, docs/DOKPLOY.md, docs/START-HERE.md, docs/COMPANY-UPDATE.md</desc>
<defs>
<marker id="11-deployment-lifecycle-data" markerWidth="10" markerHeight="10" refX="8" refY="4" orient="auto"><path d="M0,0 L0,8 L9,4 Z" fill="#2469a8"/></marker>
