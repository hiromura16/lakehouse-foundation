<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="1080" viewBox="0 0 1920 1080" role="img" aria-labelledby="02-batch-flow-title 02-batch-flow-description" font-family="Noto Sans CJK JP, Noto Sans JP, Yu Gothic, sans-serif">
<title id="02-batch-flow-title">ファイル・SQLのバッチ取り込み経路</title>
<desc id="02-batch-flow-description">SQLのread-only抽出とSamba/GUI素材は同じlanding契約へ合流する。workerが原本とBronzeを保存し、明示したmedallion操作でSilver・隔離・Goldへ進む。 根拠: scripts/extract-sqlserver.py, scripts/generate-demo.py, scripts/admin.py, medallion/sources.json</desc>
<defs>
<marker id="02-batch-flow-data" markerWidth="10" markerHeight="10" refX="8" refY="4" orient="auto"><path d="M0,0 L0,8 L9,4 Z" fill="#2469a8"/></marker>
<marker id="02-batch-flow-control" markerWidth="10" markerHeight="10" refX="8" refY="4" orient="auto"><path d="M0,0 L0,8 L9,4 Z" fill="#70608e"/></marker>
<marker id="02-batch-flow-optional" markerWidth="10" markerHeight="10" refX="8" refY="4" orient="auto"><path d="M0,0 L0,8 L9,4 Z" fill="#78818c"/></marker>
</defs>
<rect x="0" y="0" width="1920" height="1080" rx="0" fill="#fff" stroke="none"/>
<rect x="0" y="0" width="14" height="1080" rx="0" fill="#152a43" stroke="none"/>
<text x="56" y="43" fill="#536780" font-size="18" font-weight="600">LAKEHOUSE FOUNDATION  /  PoC REPORT ASSETS</text>
<text x="56" y="104" fill="#152a43" font-size="42" font-weight="700">02  ファイル・SQLのバッチ取り込み経路</text>
<path d="M1270,35 L1320,35" stroke="#2469a8" stroke-width="3"/>
<text x="1332" y="41" fill="#536780" font-size="17" font-weight="400">データ</text>
<path d="M1475,35 L1525,35" stroke="#70608e" stroke-width="3" stroke-dasharray="8 5"/>
<text x="1537" y="41" fill="#536780" font-size="17" font-weight="400">制御・設定</text>
<path d="M1680,35 L1730,35" stroke="#78818c" stroke-width="3" stroke-dasharray="3 7"/>
<text x="1742" y="41" fill="#536780" font-size="17" font-weight="400">任意・計画</text>
<text x="56" y="148" fill="#536780" font-size="23" font-weight="400">素材投入と後続処理は別操作。コピー完了後のSHA-256 readyを受入境界にする。</text>
<rect x="56" y="220" width="400" height="250" rx="16" fill="#edf4ff" stroke="#b8cee8"/>
<rect x="56" y="238" width="5" height="214" rx="2" fill="#245fa6" stroke="none"/>
<text x="80" y="262" fill="#152a43" font-size="27" font-weight="700">01｜素材の入口</text>
<text x="80" y="307" fill="#152a43" font-size="23" font-weight="400">会社SQL：6表のSELECT</text>
<text x="80" y="339" fill="#152a43" font-size="23" font-weight="400">Samba：CSV / JSON / 画像</text>
<text x="80" y="371" fill="#152a43" font-size="23" font-weight="400">GUI：合成素材だけを生成</text>
<text x="80" y="410" fill="#245fa6" font-size="20" font-weight="600">SOURCEとDEMOを分離</text>
<rect x="520" y="220" width="400" height="250" rx="16" fill="#edf4ff" stroke="#b8cee8"/>
<rect x="520" y="238" width="5" height="214" rx="2" fill="#245fa6" stroke="none"/>
<text x="544" y="262" fill="#152a43" font-size="27" font-weight="700">02｜landing完成</text>
<text x="544" y="307" fill="#152a43" font-size="23" font-weight="400">CSV4 / JSONL2 / 任意画像</text>
<text x="544" y="339" fill="#152a43" font-size="23" font-weight="400">原本完成 → readyを公開</text>
<text x="544" y="371" fill="#152a43" font-size="23" font-weight="400">ready：原本のSHA-256</text>
<text x="544" y="410" fill="#245fa6" font-size="20" font-weight="600">外部host bind</text>
<rect x="984" y="220" width="400" height="250" rx="16" fill="#eaf7f3" stroke="#a4d1c1"/>
<rect x="984" y="238" width="5" height="214" rx="2" fill="#126c59" stroke="none"/>
<text x="1008" y="262" fill="#152a43" font-size="27" font-weight="700">03｜worker検査</text>
<text x="1008" y="307" fill="#152a43" font-size="23" font-weight="400">hash・サイズ・列契約</text>
<text x="1008" y="339" fill="#152a43" font-size="23" font-weight="400">同じpath/hashはskip</text>
<text x="1008" y="371" fill="#152a43" font-size="23" font-weight="400">拒否と未完了を区別</text>
<text x="1008" y="410" fill="#126c59" font-size="20" font-weight="600">明示ingest</text>
<rect x="1448" y="220" width="416" height="250" rx="16" fill="#faf0e7" stroke="#d9baa1"/>
<rect x="1448" y="238" width="5" height="214" rx="2" fill="#85512a" stroke="none"/>
<text x="1472" y="262" fill="#152a43" font-size="27" font-weight="700">04｜原本とBronze</text>
<text x="1472" y="307" fill="#152a43" font-size="23" font-weight="400">S3：内容hashの原本キー</text>
<text x="1472" y="339" fill="#152a43" font-size="23" font-weight="400">Bronze：文字列＋由来</text>
<text x="1472" y="371" fill="#152a43" font-size="23" font-weight="400">受領台帳は最後に更新</text>
<text x="1472" y="410" fill="#85512a" font-size="20" font-weight="600">各保存は別commit</text>
<rect x="56" y="570" width="670" height="260" rx="16" fill="#edf4ff" stroke="#b8cee8"/>
<rect x="56" y="588" width="5" height="224" rx="2" fill="#245fa6" stroke="none"/>
<text x="80" y="612" fill="#152a43" font-size="27" font-weight="700">業務6ソースの契約</text>
<text x="80" y="657" fill="#152a43" font-size="23" font-weight="400">ERP：製品・指図・受注・出荷</text>
<text x="80" y="689" fill="#152a43" font-size="23" font-weight="400">MES：製造実績・設備停止</text>
<text x="80" y="721" fill="#152a43" font-size="23" font-weight="400">主キー / updated_at / UTC時刻</text>
<text x="80" y="753" fill="#152a43" font-size="23" font-weight="400">実表・列mapはprivateで管理</text>
<text x="80" y="792" fill="#245fa6" font-size="20" font-weight="600">任意CSVから業務表は自動生成しない</text>
<rect x="820" y="570" width="1044" height="250" rx="16" fill="#fff7dd" stroke="#dfca85"/>
<rect x="820" y="588" width="5" height="214" rx="2" fill="#806000" stroke="none"/>
<text x="844" y="612" fill="#152a43" font-size="27" font-weight="700">05｜明示medallion → Silver / Quarantine / Gold</text>
<text x="844" y="657" fill="#152a43" font-size="23" font-weight="400">取り込みを確認 → 最新候補 → 妥当性検査 → 業務集計</text>
<text x="844" y="689" fill="#152a43" font-size="23" font-weight="400">6 Silver＋6 Quarantine＋2 Goldの14 SQL</text>
<text x="844" y="721" fill="#152a43" font-size="23" font-weight="400">表ごとのatomic replace。全14文を束ねたtransactionではない</text>
<text x="844" y="760" fill="#806000" font-size="20" font-weight="600">SQLを版管理</text>
<path d="M 456,345 L 520,345" fill="none" stroke="#2469a8" stroke-width="3" marker-end="url(#02-batch-flow-data)"/>
<path d="M 920,345 L 984,345" fill="none" stroke="#2469a8" stroke-width="3" marker-end="url(#02-batch-flow-data)"/>
<rect x="895.6" y="311" width="112.8" height="27" rx="3" fill="#fff" stroke="none"/>
<g text-anchor="middle"><text x="952" y="330" fill="#2469a8" font-size="18" font-weight="600">ready/hash</text></g>
<path d="M 1384,345 L 1448,345" fill="none" stroke="#2469a8" stroke-width="3" marker-end="url(#02-batch-flow-data)"/>
<path d="M 1656,470 L 1656,520 L 1342,520 L 1342,570" fill="none" stroke="#70608e" stroke-width="3" stroke-dasharray="8 5" marker-end="url(#02-batch-flow-control)"/>
<rect x="1617" y="461" width="102" height="27" rx="3" fill="#fff" stroke="none"/>
<g text-anchor="middle"><text x="1668" y="480" fill="#70608e" font-size="18" font-weight="600">変換を明示</text></g>
<rect x="56" y="915" width="1808" height="1" rx="0" fill="#d7dfe8" stroke="none"/>
<text x="56" y="950" fill="#536780" font-size="20" font-weight="400">ファイルを消すだけでは取り込み済みBronzeを削除しない。会社データは合成試験と別環境で受入。</text>
<text x="56" y="977" fill="#536780" font-size="20" font-weight="400">1原本16MiB以下、契約CSV/JSONは100000行以下。SQL抽出の6表は同一時点transactionではない。</text>
<text x="56" y="1057" fill="#536780" font-size="17" font-weight="400">公開実装の説明 / 既存検証記録・計画は図内で区別 / 2026-11-11 / 根拠・キャプションは同梱台帳へ</text>
</svg>
