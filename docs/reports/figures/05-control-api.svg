<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="1080" viewBox="0 0 1920 1080" role="img" aria-labelledby="05-control-api-title 05-control-api-description" font-family="Noto Sans CJK JP, Noto Sans JP, Yu Gothic, sans-serif">
<title id="05-control-api-title">GUI・API・workerの操作責任</title>
<desc id="05-control-api-description">Streamlit・Swagger・MCP連携は固定FastAPIを使い、source jobとpipeline jobを分ける。同梱n8n/AirflowはWORKER_TOKENでworkerへ直接依頼する。設定保存からDockerやsudoを呼ばない。 根拠: infra/demo/api.py, infra/demo/job_manager.py, infra/demo/control_settings.py, scripts/admin.py</desc>
<defs>
<marker id="05-control-api-data" markerWidth="10" markerHeight="10" refX="8" refY="4" orient="auto"><path d="M0,0 L0,8 L9,4 Z" fill="#2469a8"/></marker>
<marker id="05-control-api-control" markerWidth="10" markerHeight="10" refX="8" refY="4" orient="auto"><path d="M0,0 L0,8 L9,4 Z" fill="#70608e"/></marker>
<marker id="05-control-api-optional" markerWidth="10" markerHeight="10" refX="8" refY="4" orient="auto"><path d="M0,0 L0,8 L9,4 Z" fill="#78818c"/></marker>
</defs>
<rect x="0" y="0" width="1920" height="1080" rx="0" fill="#fff" stroke="none"/>
<rect x="0" y="0" width="14" height="1080" rx="0" fill="#152a43" stroke="none"/>
<text x="56" y="43" fill="#536780" font-size="18" font-weight="600">LAKEHOUSE FOUNDATION  /  PoC REPORT ASSETS</text>
<text x="56" y="104" fill="#152a43" font-size="42" font-weight="700">05  GUI・API・workerの操作責任</text>
<path d="M1270,35 L1320,35" stroke="#2469a8" stroke-width="3"/>
<text x="1332" y="41" fill="#536780" font-size="17" font-weight="400">データ</text>
<path d="M1475,35 L1525,35" stroke="#70608e" stroke-width="3" stroke-dasharray="8 5"/>
<text x="1537" y="41" fill="#536780" font-size="17" font-weight="400">制御・設定</text>
<path d="M1680,35 L1730,35" stroke="#78818c" stroke-width="3" stroke-dasharray="3 7"/>
<text x="1742" y="41" fill="#536780" font-size="17" font-weight="400">任意・計画</text>
<text x="56" y="148" fill="#536780" font-size="23" font-weight="400">設定保存、素材生成、後続処理を分ける。APIはDockerやsudoを持たない。</text>
<rect x="56" y="230" width="420" height="250" rx="16" fill="#edf4ff" stroke="#b8cee8"/>
<rect x="56" y="248" width="5" height="214" rx="2" fill="#245fa6" stroke="none"/>
<text x="80" y="272" fill="#152a43" font-size="27" font-weight="700">利用者・クライアント</text>
<text x="80" y="317" fill="#152a43" font-size="23" font-weight="400">Streamlit / Swagger</text>
<text x="80" y="349" fill="#152a43" font-size="23" font-weight="400">MCPは内部APIへ橋渡し</text>
<text x="80" y="381" fill="#152a43" font-size="23" font-weight="400">既存tokenをURLへ入れない</text>
<text x="80" y="420" fill="#245fa6" font-size="20" font-weight="600">操作対象の環境を確認</text>
<rect x="566" y="230" width="740" height="250" rx="16" fill="#edf4ff" stroke="#b8cee8"/>
<rect x="566" y="248" width="5" height="214" rx="2" fill="#245fa6" stroke="none"/>
<text x="590" y="272" fill="#152a43" font-size="27" font-weight="700">FastAPI｜固定の業務操作</text>
<text x="590" y="317" fill="#152a43" font-size="23" font-weight="400">POST /jobs：batch / 有限streamの素材生成</text>
<text x="590" y="349" fill="#152a43" font-size="23" font-weight="400">POST /pipeline/{action}：ingest / medallion / verify</text>
<text x="590" y="381" fill="#152a43" font-size="23" font-weight="400">GET /catalog・/quality・/ai/context・/jobs</text>
<text x="590" y="420" fill="#245fa6" font-size="20" font-weight="600">CONTROL_API_TOKEN</text>
<rect x="1396" y="230" width="468" height="250" rx="16" fill="#eaf7f3" stroke="#a4d1c1"/>
<rect x="1396" y="248" width="5" height="214" rx="2" fill="#126c59" stroke="none"/>
<text x="1420" y="272" fill="#152a43" font-size="27" font-weight="700">worker｜実行と排他</text>
<text x="1420" y="317" fill="#152a43" font-size="23" font-weight="400">起動時bootstrap → ready</text>
<text x="1420" y="349" fill="#152a43" font-size="23" font-weight="400">busy / blockedを確認</text>
<text x="1420" y="381" fill="#152a43" font-size="23" font-weight="400">未確認timeoutの自動retryなし</text>
<text x="1420" y="420" fill="#126c59" font-size="20" font-weight="600">WORKER_TOKEN</text>
<rect x="56" y="600" width="560" height="280" rx="16" fill="#f1edfc" stroke="#c6b9e9"/>
<rect x="56" y="618" width="5" height="244" rx="2" fill="#63449b" stroke="none"/>
<text x="80" y="642" fill="#152a43" font-size="27" font-weight="700">設定保存 → 管理者が適用</text>
<text x="80" y="687" fill="#152a43" font-size="23" font-weight="400">private envへatomic保存</text>
<text x="80" y="719" fill="#152a43" font-size="23" font-weight="400">saved=true / applied=false</text>
<text x="80" y="751" fill="#152a43" font-size="23" font-weight="400">管理者がDokploy envと同期</text>
<text x="80" y="783" fill="#152a43" font-size="23" font-weight="400">Deploy後にhealthを再確認</text>
<text x="80" y="822" fill="#63449b" font-size="20" font-weight="600">保存だけでは稼働設定は変わらない</text>
<rect x="708" y="600" width="560" height="280" rx="16" fill="#faf0e7" stroke="#d9baa1"/>
<rect x="708" y="618" width="5" height="244" rx="2" fill="#85512a" stroke="none"/>
<text x="732" y="642" fill="#152a43" font-size="27" font-weight="700">素材job</text>
<text x="732" y="687" fill="#152a43" font-size="23" font-weight="400">landing / 専用DEMO SQL</text>
<text x="732" y="719" fill="#152a43" font-size="23" font-weight="400">新規schema / 明示書込同意</text>
<text x="732" y="751" fill="#152a43" font-size="23" font-weight="400">ここからpipelineは呼ばない</text>
<text x="732" y="790" fill="#85512a" font-size="20" font-weight="600">素材だけを投入</text>
<rect x="1360" y="600" width="504" height="280" rx="16" fill="#fff7dd" stroke="#dfca85"/>
<rect x="1360" y="618" width="5" height="244" rx="2" fill="#806000" stroke="none"/>
<text x="1384" y="642" fill="#152a43" font-size="27" font-weight="700">n8n / Airflow</text>
<text x="1384" y="687" fill="#152a43" font-size="23" font-weight="400">WORKER_TOKENで認証</text>
<text x="1384" y="719" fill="#152a43" font-size="23" font-weight="400">worker:8000/runへ直接依頼</text>
<text x="1384" y="751" fill="#152a43" font-size="23" font-weight="400">同梱の手動workflow / DAG</text>
<text x="1384" y="783" fill="#152a43" font-size="23" font-weight="400">FastAPIは経由しない</text>
<text x="1384" y="822" fill="#806000" font-size="20" font-weight="600">定期実行担当は一つに決める</text>
<path d="M 476,355 L 566,355" fill="none" stroke="#70608e" stroke-width="3" stroke-dasharray="8 5" marker-end="url(#05-control-api-control)"/>
<rect x="484.76" y="321" width="72.48" height="27" rx="3" fill="#fff" stroke="none"/>
<g text-anchor="middle"><text x="521" y="340" fill="#70608e" font-size="18" font-weight="600">Bearer</text></g>
<path d="M 1306,355 L 1396,355" fill="none" stroke="#70608e" stroke-width="3" stroke-dasharray="8 5" marker-end="url(#05-control-api-control)"/>
<rect x="1286.68" y="321" width="128.64" height="27" rx="3" fill="#fff" stroke="none"/>
<g text-anchor="middle"><text x="1351" y="340" fill="#70608e" font-size="18" font-weight="600">明示pipeline</text></g>
<path d="M 740,480 L 740,535 L 336,535 L 336,600" fill="none" stroke="#70608e" stroke-width="3" stroke-dasharray="8 5" marker-end="url(#05-control-api-control)"/>
<rect x="670.4" y="473.5" width="163.2" height="27" rx="3" fill="#fff" stroke="none"/>
<g text-anchor="middle"><text x="752" y="492.5" fill="#70608e" font-size="18" font-weight="600">PATCH /settings</text></g>
<path d="M 1060,480 L 1060,555 L 988,555 L 988,600" fill="none" stroke="#70608e" stroke-width="3" stroke-dasharray="8 5" marker-end="url(#05-control-api-control)"/>
<rect x="1015.6" y="483.5" width="112.8" height="27" rx="3" fill="#fff" stroke="none"/>
<g text-anchor="middle"><text x="1072" y="502.5" fill="#70608e" font-size="18" font-weight="600">POST /jobs</text></g>
<path d="M 1612,600 L 1612,480" fill="none" stroke="#70608e" stroke-width="3" stroke-dasharray="8 5" marker-end="url(#05-control-api-control)"/>
<rect x="1557.52" y="506" width="132.96" height="27" rx="3" fill="#fff" stroke="none"/>
<g text-anchor="middle"><text x="1624" y="525" fill="#70608e" font-size="18" font-weight="600">WORKER_TOKEN</text></g>
<rect x="56" y="915" width="1808" height="1" rx="0" fill="#d7dfe8" stroke="none"/>
<text x="56" y="950" fill="#536780" font-size="20" font-weight="400">APIは1worker前提。直近20件のjob履歴はメモリ内で、API再起動後は失われる。</text>
<text x="56" y="977" fill="#536780" font-size="20" font-weight="400">タイムアウトは処理停止を意味しない。workerのbusyと実体を見て、二重実行を避ける。</text>
<text x="56" y="1057" fill="#536780" font-size="17" font-weight="400">公開実装の説明 / 既存検証記録・計画は図内で区別 / 2026-11-11 / 根拠・キャプションは同梱台帳へ</text>
</svg>
