    <path d="M866 194 L1012 246 L1012 261 L866 209 Z" fill="#788f9f" stroke="#d2e4ed"/>
    <path d="M1012 246 L1148 194 L1148 209 L1012 261 Z" fill="#5a778b" stroke="#d2e4ed"/>
    <path d="M866 139 L1002 87 L1148 139 L1012 191 Z" fill="url(#top-layer)" stroke="#b5f8e3"/>
