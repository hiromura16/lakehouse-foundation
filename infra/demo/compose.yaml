# 役割: Streamlit画面と認証付きFastAPI/Swaggerを追加する操作面。
# coreの後に同じprojectへ結合する。素材生成と後続の取込/変換は別の明示操作。
# 読む順序: demo-apiの書込境界 → landing/private bind → 画面のAPI接続。
# demoはAPIと画面、mcpはAPIだけを起動対象にする。GUIはmcpから暗黙起動しない。
# 公開先はBIND_IPの既定loopback。外部公開の認証/TLSは別に準備する。

# 内部service名をproxy対象から除外し、社内proxyへ内部要求を送らない。
# 同じ除外値を大文字/小文字の両方へ渡し、利用libraryの違いを吸収する。
x-effective-no-proxy: &effective_no_proxy "${LAKEHOUSE_NO_PROXY:-localhost,127.0.0.1,::1,storage,catalog,catalog-db,trino,worker,catalog-migrate,n8n-db,n8n,prometheus,grafana,node-exporter,cadvisor,loki,vector,spark-volumes-init,spark-master,spark-worker,spark-history,spark-check,airflow-db,airflow,demo-api,demo,cdc-kafka,cdc-connect,cdc-ui,cdc-register,cdc-consumer,superset-db,superset-redis,superset-init,superset,jupyter,qdrant,marquez-db,marquez,marquez-web,mcp,dokploy,dokploy-postgres,dokploy-traefik,${NO_PROXY:-},${no_proxy:-}}"

# API/画面のログ保存量を揃える共通定義。APIのaccess logは別途無効化する。
x-demo-logging: &demo_logging
  driver: json-file
  options:
    max-size: 10m
    max-file: '3'

services:
  # 素材と専用private設定へ書き込む唯一の操作コンテナ。Swaggerもここから提供する。
  # UI/MCPの認証を検査し、非同期jobと固定された操作を管理する。
  # APIの起動成功はworkerや任意profileの処理成功とは別に確認する。
  demo-api:
    profiles: [demo, mcp]
    image: ${COMPOSE_PROJECT_NAME:-lakehouse}-demo:local
    # Rebuild this local tag through its single owner; retain build cache.
    pull_policy: build
    build:
      secrets:
        - corporate_ca
      context: ../..
      dockerfile: infra/demo/Dockerfile
      args:
        HTTP_PROXY: ${HTTP_PROXY:-}
        HTTPS_PROXY: ${HTTPS_PROXY:-}
        NO_PROXY: *effective_no_proxy
        http_proxy: ${http_proxy:-}
        https_proxy: ${https_proxy:-}
        no_proxy: *effective_no_proxy
    user: "${WORKER_UID:?Set the landing reader UID}:${WORKER_GID:?Set the landing reader GID}"
    restart: unless-stopped
    labels:
      app.owner: lakehouse-foundation
      traefik.enable: 'false'
    logging: *demo_logging
    mem_limit: 512m
    cpus: 1
    environment:
      CONTROL_API_TOKEN: ${CONTROL_API_TOKEN:-}
      CONTROL_SETTINGS_FILE: /private/${CONTROL_SETTINGS_NAME:-site.env}
      DEMO_LANDING_DIR: /landing
      WORKER_URL: http://worker:8000
      HTTP_PROXY: ${HTTP_PROXY:-}
      HTTPS_PROXY: ${HTTPS_PROXY:-}
      NO_PROXY: *effective_no_proxy
      http_proxy: ${http_proxy:-}
      https_proxy: ${https_proxy:-}
      no_proxy: *effective_no_proxy
    # 設定をatomic replaceするため、ファイル単体ではなく専用ディレクトリをmountする。
    # WORKER_UID/GIDが書き込める環境専用の領域を用意し、他の秘密を同居させない。
    # 保存は再配置と別の操作。コンテナ起動値の反映はCLI/Dokploy側で行う。
    volumes:
      - type: bind
        source: ${LANDING_DIR:?Set an external landing directory}
        target: /landing
      - type: bind
        source: ${CONTROL_SETTINGS_DIR:-/srv/lakehouse/private}
        target: /private
    ports:
      - ${BIND_IP:-127.0.0.1}:${DEMO_API_PORT:-8502}:8000
    command:
      - python
      - -m
      - uvicorn
      - api:app
      - --app-dir
      - /opt/lakehouse/infra/demo
      - --host
      - 0.0.0.0
      - --port
      - '8000'
      - --no-access-log
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - import urllib.request; urllib.request.urlopen("http://127.0.0.1:8000/health", timeout=3)
      interval: 10s
      timeout: 5s
      retries: 30

  # Streamlit serverから内部APIを呼ぶ。hostのディレクトリを直接mountしない。
  # demo-apiのhealthyを待つため、画面と書込処理の起動条件を分離できる。
  demo:
    profiles: [demo]
    image: ${COMPOSE_PROJECT_NAME:-lakehouse}-demo:local
    # Reuse the owner-built local tag; never query a registry for it.
    pull_policy: never
    user: "${WORKER_UID:?Set the landing reader UID}:${WORKER_GID:?Set the landing reader GID}"
    restart: unless-stopped
    labels:
      app.owner: lakehouse-foundation
      traefik.enable: 'false'
    logging: *demo_logging
    mem_limit: 768m
    cpus: 1
    environment:
      DEMO_API_URL: http://demo-api:8000
      CONTROL_API_TOKEN: ${CONTROL_API_TOKEN:-}
    ports:
      - ${BIND_IP:-127.0.0.1}:${DEMO_GUI_PORT:-8501}:8501
    depends_on:
      demo-api:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - import urllib.request; urllib.request.urlopen("http://127.0.0.1:8501/_stcore/health", timeout=3)
      interval: 10s
      timeout: 5s
      retries: 30
