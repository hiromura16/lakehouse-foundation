# Optional standalone Airflow lab, merged on the core project's default network.
services:
  airflow-db:
    profiles: [orchestration]
    image: postgres:18.6-alpine@sha256:123b17998ccaf47e53b502e8c6a1e79afd8f579c6f3eec83c563da026f957395
    restart: unless-stopped
    labels:
      app.owner: lakehouse-foundation
      traefik.enable: 'false'
    mem_limit: 384m
    environment:
      POSTGRES_DB: airflow
      POSTGRES_USER: airflow
      POSTGRES_PASSWORD: ${AIRFLOW_DB_PASSWORD:?Generate Airflow private settings}
    volumes:
      - airflow-db:/var/lib/postgresql
    healthcheck:
      test: [CMD-SHELL, 'pg_isready -U airflow -d airflow']
      interval: 5s
      timeout: 3s
      retries: 30
    logging: &airflow_logging
      driver: json-file
      options:
        max-size: 10m
        max-file: '3'
  airflow:
    profiles: [orchestration]
    image: ${COMPOSE_PROJECT_NAME:-lakehouse}-airflow:local
    build:
      context: ../..
      dockerfile: infra/orchestration/Dockerfile
      args:
        HTTP_PROXY: ${HTTP_PROXY:-}
        HTTPS_PROXY: ${HTTPS_PROXY:-}
        NO_PROXY: ${NO_PROXY:-}
        http_proxy: ${http_proxy:-}
        https_proxy: ${https_proxy:-}
        no_proxy: ${no_proxy:-}
    restart: unless-stopped
    labels:
      app.owner: lakehouse-foundation
      traefik.enable: 'false'
    mem_limit: 4g
    cpus: 2
    environment:
      AIRFLOW_HOME: /opt/airflow
      AIRFLOW__CORE__DAGS_FOLDER: /opt/lakehouse/dags
      AIRFLOW__CORE__EXECUTOR: LocalExecutor
      AIRFLOW__CORE__LOAD_EXAMPLES: 'false'
      AIRFLOW__CORE__DAGS_ARE_PAUSED_AT_CREATION: 'true'
      AIRFLOW__CORE__SIMPLE_AUTH_MANAGER_USERS: admin:admin
      AIRFLOW__CORE__SIMPLE_AUTH_MANAGER_ALL_ADMINS: 'false'
      AIRFLOW__CORE__FERNET_KEY: ${AIRFLOW_FERNET_KEY:?Generate Airflow private settings}
      AIRFLOW__API_AUTH__JWT_SECRET: ${AIRFLOW_JWT_SECRET:?Generate Airflow private settings}
      AIRFLOW__CORE__PARALLELISM: '2'
      AIRFLOW__CORE__MAX_ACTIVE_TASKS_PER_DAG: '1'
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg://airflow:${AIRFLOW_DB_PASSWORD}@airflow-db:5432/airflow
      HTTP_PROXY: ${HTTP_PROXY:-}
      HTTPS_PROXY: ${HTTPS_PROXY:-}
      NO_PROXY: ${NO_PROXY:-}
      http_proxy: ${http_proxy:-}
      https_proxy: ${https_proxy:-}
      no_proxy: ${no_proxy:-}
    command: [standalone]
    volumes:
      - airflow-state:/opt/airflow
    ports:
      - ${BIND_IP:-127.0.0.1}:${AIRFLOW_PORT:-8081}:8080
    depends_on:
      airflow-db:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - >-
          import json, urllib.request;
          r=urllib.request.urlopen('http://127.0.0.1:8080/api/v2/monitor/health',timeout=5);
          assert json.load(r)['scheduler']['status']=='healthy'
      interval: 15s
      timeout: 8s
      retries: 30
      start_period: 90s
    logging: *airflow_logging
volumes:
  # Use the same optional migration prefix as the core data volumes.
  airflow-db:
    name: ${DATA_VOLUME_PREFIX:-${COMPOSE_PROJECT_NAME:-lakehouse}}_airflow-db
  airflow-state:
    name: ${DATA_VOLUME_PREFIX:-${COMPOSE_PROJECT_NAME:-lakehouse}}_airflow-state
