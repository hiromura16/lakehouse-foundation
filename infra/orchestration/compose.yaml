# 役割: orchestration profileで、workerの登録済み処理を手動DAGから呼ぶ。
# coreと同じprojectへ結合する。Spark処理系をAirflow内へ同居させる構成ではない。
# 読む順序: metadata DB → standalone Airflow → state volume。
# API・scheduler等を単一コンテナで動かすPoC用。並列数とprofileを明示して使う。
# Webの公開先はBIND_IPの既定loopback。DBはhostへ公開しない。

# 内部service名をproxy対象から除外し、社内proxyへ内部要求を送らない。
# 同じ除外値を大文字/小文字の両方へ渡し、利用libraryの違いを吸収する。
x-effective-no-proxy: &effective_no_proxy "${LAKEHOUSE_NO_PROXY:-localhost,127.0.0.1,::1,storage,catalog,catalog-db,trino,worker,catalog-migrate,n8n-db,n8n,prometheus,grafana,node-exporter,cadvisor,spark-volumes-init,spark-master,spark-worker,spark-history,spark-check,airflow-db,airflow,demo-api,demo,cdc-kafka,cdc-connect,cdc-ui,cdc-register,cdc-consumer,superset-db,superset-redis,superset-init,superset,jupyter,qdrant,marquez-db,marquez,marquez-web,mcp,dokploy,dokploy-postgres,dokploy-traefik,${NO_PROXY:-},${no_proxy:-}}"

services:
  # DAG実行状態とConnection等のmetadataを保存し、catalog DBとは独立させる。
  airflow-db:
    profiles: [orchestration]
    image: postgres:18.6-alpine@sha256:123b17998ccaf47e53b502e8c6a1e79afd8f579c6f3eec83c563da026f957395
    restart: unless-stopped
    labels:
      app.owner: lakehouse-foundation
      traefik.enable: 'false'
    mem_limit: 384m
    environment:
      POSTGRES_DB: airflow
      POSTGRES_USER: airflow
      POSTGRES_PASSWORD: ${AIRFLOW_DB_PASSWORD:?Generate Airflow private settings}
    volumes:
      - airflow-db:/var/lib/postgresql
    healthcheck:
      test: [CMD-SHELL, 'pg_isready -U airflow -d airflow']
      interval: 5s
      timeout: 3s
      retries: 30
    # metadata DBとAirflowで同じ回転上限を使い、標準ログの保管量を揃える。
    logging: &airflow_logging
      driver: json-file
      options:
        max-size: 10m
        max-file: '3'
  # LocalExecutorのstandalone環境。DBがhealthyになってから起動する。
  # 同梱DAGは手動実行・再試行0でworkerを呼ぶ。DAG作成時もpause状態を維持する。
  # worker tokenは実行時にConnectionから読み、Composeに業務資格情報を埋め込まない。
  airflow:
    profiles: [orchestration]
    image: ${COMPOSE_PROJECT_NAME:-lakehouse}-airflow:local
    # Rebuild this local tag through its single owner; retain build cache.
    pull_policy: build
    build:
      secrets:
        - corporate_ca
      context: ../..
      dockerfile: infra/orchestration/Dockerfile
      args:
        HTTP_PROXY: ${HTTP_PROXY:-}
        HTTPS_PROXY: ${HTTPS_PROXY:-}
        NO_PROXY: *effective_no_proxy
        http_proxy: ${http_proxy:-}
        https_proxy: ${https_proxy:-}
        no_proxy: *effective_no_proxy
    restart: unless-stopped
    labels:
      app.owner: lakehouse-foundation
      traefik.enable: 'false'
    mem_limit: 4g
    cpus: 2
    environment:
      AIRFLOW_HOME: /opt/airflow
      AIRFLOW__CORE__DAGS_FOLDER: /opt/lakehouse/dags
      AIRFLOW__CORE__EXECUTOR: LocalExecutor
      AIRFLOW__CORE__LOAD_EXAMPLES: 'false'
      AIRFLOW__CORE__DAGS_ARE_PAUSED_AT_CREATION: 'true'
      AIRFLOW__CORE__SIMPLE_AUTH_MANAGER_USERS: admin:admin
      AIRFLOW__CORE__SIMPLE_AUTH_MANAGER_ALL_ADMINS: 'false'
      AIRFLOW__CORE__FERNET_KEY: ${AIRFLOW_FERNET_KEY:?Generate Airflow private settings}
      AIRFLOW__API_AUTH__JWT_SECRET: ${AIRFLOW_JWT_SECRET:?Generate Airflow private settings}
      AIRFLOW__CORE__PARALLELISM: '2'
      AIRFLOW__CORE__MAX_ACTIVE_TASKS_PER_DAG: '1'
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg://airflow:${AIRFLOW_DB_PASSWORD}@airflow-db:5432/airflow
      HTTP_PROXY: ${HTTP_PROXY:-}
      HTTPS_PROXY: ${HTTPS_PROXY:-}
      NO_PROXY: *effective_no_proxy
      http_proxy: ${http_proxy:-}
      https_proxy: ${https_proxy:-}
      no_proxy: *effective_no_proxy
    command: [standalone]
    volumes:
      - airflow-state:/opt/airflow
    ports:
      - ${BIND_IP:-127.0.0.1}:${AIRFLOW_PORT:-8081}:8080
    depends_on:
      airflow-db:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - >-
          import json, urllib.request;
          r=urllib.request.urlopen('http://127.0.0.1:8080/api/v2/monitor/health',timeout=5);
          assert json.load(r)['scheduler']['status']=='healthy'
      interval: 15s
      timeout: 8s
      retries: 30
      start_period: 90s
    logging: *airflow_logging
# metadata DBとAirflow homeは別volume。復旧時はFernet/JWT鍵との対応も確認する。
volumes:
  # 既存volumeの引継ぎprefixはcoreと同じ規則にし、DBだけの別環境参照を避ける。
  airflow-db:
    name: ${DATA_VOLUME_PREFIX:-${COMPOSE_PROJECT_NAME:-lakehouse}}_airflow-db
  airflow-state:
    name: ${DATA_VOLUME_PREFIX:-${COMPOSE_PROJECT_NAME:-lakehouse}}_airflow-state
