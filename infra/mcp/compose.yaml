# 役割: AIクライアントへ固定tool/resourceをStreamable HTTPで提供する。
# core/demoの後に同じprojectへ結合する。処理の実行とsite設定はdemo-apiが担当する。
# 読む順序: build → 最小権限 → 入口token/操作許可 → demo-api依存。
# 任意SQL・shell・Docker操作を公開せず、モデル推論や外部AI送信も行わない。
# 既定は参照のみ。変更操作はMCP_ENABLE_MUTATIONSとAPI側検査の両方に従う。

# 内部service名をproxy対象から除外し、社内proxyへ内部要求を送らない。
# 同じ除外値を大文字/小文字の両方へ渡し、利用libraryの違いを吸収する。
x-effective-no-proxy: &effective_no_proxy "${LAKEHOUSE_NO_PROXY:-localhost,127.0.0.1,::1,storage,catalog,catalog-db,trino,worker,catalog-migrate,n8n-db,n8n,prometheus,grafana,node-exporter,cadvisor,spark-volumes-init,spark-master,spark-worker,spark-history,spark-check,airflow-db,airflow,demo-api,demo,cdc-kafka,cdc-connect,cdc-ui,cdc-register,cdc-consumer,superset-db,superset-redis,superset-init,superset,jupyter,qdrant,marquez-db,marquez,marquez-web,mcp,dokploy,dokploy-postgres,dokploy-traefik,${NO_PROXY:-},${no_proxy:-}}"

services:
  # MCP tokenを検査し、固定の要求を別token付きでdemo-apiへ橋渡しする。
  # host設定やlandingをmountせず、書込可能な領域は一時領域に限定する。
  # APIがhealthyになってから起動し、hostの公開先はBIND_IPの既定loopbackとする。
  mcp:
    profiles: [mcp]
    image: ${COMPOSE_PROJECT_NAME:-lakehouse}-mcp:local
    # Rebuild this local tag through its single owner; retain build cache.
    pull_policy: build
    build:
      context: ../..
      dockerfile: infra/mcp/Dockerfile
      secrets: [corporate_ca]
      args:
        HTTP_PROXY: ${HTTP_PROXY:-}
        HTTPS_PROXY: ${HTTPS_PROXY:-}
        NO_PROXY: *effective_no_proxy
        http_proxy: ${http_proxy:-}
        https_proxy: ${https_proxy:-}
        no_proxy: *effective_no_proxy
    restart: unless-stopped
    labels:
      app.owner: lakehouse-foundation
      traefik.enable: 'false'
    mem_limit: 256m
    cpus: 1
    read_only: true
    tmpfs:
      - /tmp:size=32m,mode=1777
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    environment:
      MCP_API_TOKEN: ${MCP_API_TOKEN:-}
      CONTROL_API_TOKEN: ${CONTROL_API_TOKEN:-}
      MCP_ENABLE_MUTATIONS: ${MCP_ENABLE_MUTATIONS:-false}
      MCP_ALLOWED_HOSTS: ${MCP_ALLOWED_HOSTS:-localhost:*,127.0.0.1:*,mcp:*}
      MCP_CONTROL_API_URL: http://demo-api:8000
    ports:
      - ${BIND_IP:-127.0.0.1}:${MCP_PORT:-8503}:8001
    depends_on:
      demo-api:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - import urllib.request; urllib.request.urlopen('http://127.0.0.1:8001/health',timeout=3)
      interval: 10s
      timeout: 5s
      retries: 30
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: '3'
