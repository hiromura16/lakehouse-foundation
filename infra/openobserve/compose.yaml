# Optional, isolated comparison target. No dependency from Loki or Grafana.
services:
  openobserve:
    image: ${COMPOSE_PROJECT_NAME:-lakehouse}-openobserve:local
    pull_policy: build
    build:
      context: ../..
      dockerfile: infra/openobserve/Dockerfile
      args:
        WORKER_UID: ${WORKER_UID:-10001}
        WORKER_GID: ${WORKER_GID:-10001}
    profiles: [openobserve-lab]
    restart: unless-stopped
    user: ${WORKER_UID:-10001}:${WORKER_GID:-10001}
    mem_limit: 2g
    cpus: 2
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    labels:
      app.owner: lakehouse-foundation
      traefik.enable: 'false'
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: '3'
    environment:
      ZO_ROOT_USER_EMAIL: ${OPENOBSERVE_ROOT_USER_EMAIL:-}
      ZO_ROOT_USER_PASSWORD: ${OPENOBSERVE_ROOT_USER_PASSWORD:-}
      ZO_HTTP_ADDR: 0.0.0.0
      ZO_HTTP_PORT: '5080'
      ZO_LOCAL_MODE: 'true'
      ZO_LOCAL_MODE_STORAGE: disk
      ZO_META_STORE: sqlite
      ZO_QUEUE_STORE: memory
      ZO_DATA_DIR: /data/
      ZO_COMPACT_DATA_RETENTION_DAYS: '7'
      ZO_TELEMETRY: 'false'
      ZO_USAGE_REPORTING_MODE: local
      ZO_USAGE_REPORTING_ERRORS_ENABLED: 'false'
      ZO_TRACING_ENABLED: 'false'
      ZO_PROMETHEUS_ENABLED: 'false'
      # Explicit budgets reduce dependence on host-wide memory discovery.
      ZO_MEM_TABLE_MAX_SIZE: '128'
      ZO_MEMORY_CACHE_ENABLED: 'false'
      ZO_MEMORY_CACHE_DATAFUSION_MAX_SIZE: '256'
      ZO_HTTP_WORKER_NUM: '2'
      ZO_QUERY_THREAD_NUM: '2'
    volumes:
      - openobserve-data:/data
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=64m
    ports:
      - 127.0.0.1:${OPENOBSERVE_PORT:-5080}:5080
    healthcheck:
      test: [CMD, /bin/busybox, sh, /etc/lakehouse-openobserve/health.sh]
      interval: 15s
      timeout: 6s
      retries: 12
      start_period: 30s

volumes:
  openobserve-data:
    name: ${DATA_VOLUME_PREFIX:-${COMPOSE_PROJECT_NAME:-lakehouse}}_openobserve-data
