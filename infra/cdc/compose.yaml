# 役割: 外部SQL Serverの変更をDebezium/Kafka経由でCDC用Iceberg表へ反映する。
# cdc profileをcoreと同じprojectへ追加する。業務DB本体とDBAのCDC有効化は外部準備。
# 読む順序: 共通設定 → Kafka → Connect → 登録one-shot → consumer → 管理UI。
# 元イベントの保持と再開用SQLiteは別volumeで管理し、対応する設定と一組で扱う。
# Connect/UIの公開はloopback固定。KafkaのPLAINTEXT接続はCompose内だけ。

# 内部service名をproxy対象から除外し、社内proxyへ内部要求を送らない。
# 同じ除外値を大文字/小文字の両方へ渡し、利用libraryの違いを吸収する。
x-effective-no-proxy: &effective_no_proxy "${LAKEHOUSE_NO_PROXY:-localhost,127.0.0.1,::1,storage,catalog,catalog-db,trino,worker,catalog-migrate,n8n-db,n8n,prometheus,grafana,spark-volumes-init,spark-master,spark-worker,spark-history,spark-check,airflow-db,airflow,demo-api,demo,cdc-kafka,cdc-connect,cdc-ui,cdc-register,cdc-consumer,superset-db,superset-redis,superset-init,superset,jupyter,qdrant,marquez-db,marquez,marquez-web,mcp,dokploy,dokploy-postgres,dokploy-traefik,${NO_PROXY:-},${no_proxy:-}}"

# Connect・登録器・consumerで外部DBとtopic/mappingの識別を揃える。
# SQL Server/Kafkaへの接続をHTTP proxyで中継する設定ではない。
x-cdc-environment: &cdc_environment
  CDC_SOURCE_MODE: ${CDC_SOURCE_MODE:-generic}
  CDC_SQLSERVER_HOST: ${CDC_SQLSERVER_HOST:-}
  CDC_SQLSERVER_PORT: ${CDC_SQLSERVER_PORT:-1433}
  CDC_SQLSERVER_DATABASE: ${CDC_SQLSERVER_DATABASE:-}
  CDC_SQLSERVER_USER: ${CDC_SQLSERVER_USER:-}
  CDC_SQLSERVER_PASSWORD: ${CDC_SQLSERVER_PASSWORD:-}
  CDC_SQLSERVER_TRUSTSTORE: ${CDC_SQLSERVER_TRUSTSTORE:-}
  CDC_SQLSERVER_TRUSTSTORE_PASSWORD: ${CDC_SQLSERVER_TRUSTSTORE_PASSWORD:-}
  CDC_SQLSERVER_HOSTNAME_IN_CERTIFICATE: ${CDC_SQLSERVER_HOSTNAME_IN_CERTIFICATE:-}
  CDC_SQLSERVER_AGENT_STATUS_QUERY: ${CDC_SQLSERVER_AGENT_STATUS_QUERY:-}
  CDC_TEST_TRUST_SERVER_CERTIFICATE: ${CDC_TEST_TRUST_SERVER_CERTIFICATE:-false}
  CDC_TOPIC_PREFIX: ${CDC_TOPIC_PREFIX:-factory}
  CDC_CONNECTOR_NAME: ${CDC_CONNECTOR_NAME:-factory-source}
  CDC_GROUP_ID: ${CDC_GROUP_ID:-lakehouse-cdc}
  CDC_BATCH_SIZE: ${CDC_BATCH_SIZE:-100}
  CDC_POLL_SECONDS: ${CDC_POLL_SECONDS:-5}
  CDC_CONNECT_PORT: ${CDC_CONNECT_PORT:-8083}
  # fixed-demoは同じSOURCE読取接続を利用する。DEMO writer/制御writerは渡さない。
  SOURCE_SQLSERVER_HOST: ${SOURCE_SQLSERVER_HOST:-}
  SOURCE_SQLSERVER_PORT: ${SOURCE_SQLSERVER_PORT:-1433}
  SOURCE_SQLSERVER_DATABASE: ${SOURCE_SQLSERVER_DATABASE:-}
  SOURCE_SQLSERVER_USER: ${SOURCE_SQLSERVER_USER:-}
  SOURCE_SQLSERVER_PASSWORD: ${SOURCE_SQLSERVER_PASSWORD:-}
  SOURCE_SQLSERVER_ENCRYPT: ${SOURCE_SQLSERVER_ENCRYPT:-true}
  SOURCE_SQLSERVER_TRUST_SERVER_CERTIFICATE: ${SOURCE_SQLSERVER_TRUST_SERVER_CERTIFICATE:-false}
  SOURCE_SQLSERVER_HOSTNAME_IN_CERTIFICATE: ${SOURCE_SQLSERVER_HOSTNAME_IN_CERTIFICATE:-}
  SOURCE_SQLSERVER_TIMEZONE: ${SOURCE_SQLSERVER_TIMEZONE:-UTC}

# 所有権検査はPythonだけで行う。Java Connectへmarker/tokenを配布しない。
x-fixed-cdc-identity: &fixed_cdc_identity
  DEMO_SQLSERVER_INSTALLATION_ID: ${DEMO_SQLSERVER_INSTALLATION_ID:-}
  DEMO_SQLSERVER_OWNERSHIP_TOKEN: ${DEMO_SQLSERVER_OWNERSHIP_TOKEN:-}
  DEMO_SQLSERVER_ERP_SCHEMA: ${DEMO_SQLSERVER_ERP_SCHEMA:-lh_demo_erp}
  DEMO_SQLSERVER_MES_SCHEMA: ${DEMO_SQLSERVER_MES_SCHEMA:-lh_demo_mes}
  DEMO_SQLSERVER_CONTROL_SCHEMA: ${DEMO_SQLSERVER_CONTROL_SCHEMA:-lh_demo_ctl}
  # CAは固定targetへread-only bind。空欄ならsystem trustを使用する。
  SOURCE_SQLSERVER_CA_FILE: ${SOURCE_SQLSERVER_CA_FILE:+/run/source-certs/source-ca.pem}

# system trustはSOURCE_CA_FILEを空欄にする。custom PEMはprivate Compose overrideで
# この固定targetのmountを置換する。0byte placeholderのままではpreflightを拒否。
# generic CDCが使用しないSOURCE pathを勝手にmountして既存配置を壊さない。
x-source-ca-mount: &source_ca_mount
  type: bind
  source: ../proxy/empty-ca.pem
  target: /run/source-certs/source-ca.pem
  read_only: true
  bind:
    create_host_path: false

# 管理対象を識別し、内部CDCサービスのTraefik自動公開を止める。
x-cdc-labels: &cdc_labels
  app.owner: lakehouse-foundation
  traefik.enable: 'false'

# 各段階の標準ログを回転させる。イベント本体の保存先はKafka/state/Iceberg。
x-cdc-logging: &cdc_logging
  driver: json-file
  options:
    max-size: 10m
    max-file: '3'

services:
  # 変更イベントとConnectの管理topicを保存する単一nodeのKRaft broker。
  # replication factor=1は単一ホストPoC向けで、別nodeへの冗長化を意味しない。
  cdc-kafka:
    profiles: [cdc]
    image: apache/kafka:4.4.0@sha256:833b867a9585a141da455dc2b57431c65cbccb27f11c91f694444cca9f777e0f
    restart: unless-stopped
    labels: *cdc_labels
    logging: *cdc_logging
    mem_limit: 768m
    environment:
      CLUSTER_ID: ${CDC_KAFKA_CLUSTER_ID:-}
      KAFKA_NODE_ID: '1'
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://cdc-kafka:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@cdc-kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: '1'
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: '1'
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: '1'
      KAFKA_LOG_DIRS: /var/lib/kafka/data
      KAFKA_NUM_PARTITIONS: '1'
      KAFKA_LOG_RETENTION_HOURS: '168'
      KAFKA_LOG_RETENTION_BYTES: '1073741824'
      KAFKA_HEAP_OPTS: -Xms256m -Xmx384m
    volumes:
      - cdc-kafka:/var/lib/kafka/data
    healthcheck:
      test:
        - CMD-SHELL
        - KAFKA_HEAP_OPTS='-Xmx128m' /opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:9092 --list >/dev/null
      interval: 10s
      timeout: 8s
      retries: 30

  # 外部SQL Serverへ接続し、snapshotと変更イベントをKafka topicへ送る。
  # connectorの設定・offset・statusはKafkaのtopicに保存し、独立DBは設けない。
  cdc-connect:
    profiles: [cdc]
    image: quay.io/debezium/connect:3.7.1.Final@sha256:53c6d0424d09f7ccef813c895fb9b1056a726bc14ff2e6a592856cd627ebd491
    restart: unless-stopped
    labels: *cdc_labels
    logging: *cdc_logging
    mem_limit: 1024m
    environment:
      <<: *cdc_environment
      BOOTSTRAP_SERVERS: cdc-kafka:9092
      GROUP_ID: ${CDC_GROUP_ID:-lakehouse-cdc}-connect
      CONFIG_STORAGE_TOPIC: _connect_configs
      OFFSET_STORAGE_TOPIC: _connect_offsets
      STATUS_STORAGE_TOPIC: _connect_status
      CONNECT_CONFIG_STORAGE_REPLICATION_FACTOR: '1'
      CONNECT_OFFSET_STORAGE_REPLICATION_FACTOR: '1'
      CONNECT_STATUS_STORAGE_REPLICATION_FACTOR: '1'
      CONNECT_CONFIG_PROVIDERS: env
      CONNECT_CONFIG_PROVIDERS_ENV_CLASS: org.apache.kafka.common.config.provider.EnvVarConfigProvider
      HEAP_OPTS: -Xms256m -Xmx512m
      ADVERTISED_HOST_NAME: cdc-connect
    # truststoreの公開証明書だけを渡し、private mappingディレクトリ全体は渡さない。
    # JVM標準CAを使う場合は未使用のtargetへ/dev/nullをbindし、秘密ファイルを追加しない。
    volumes:
      - type: bind
        source: ${CDC_SQLSERVER_TRUSTSTORE_FILE:-/dev/null}
        target: /run/cdc/sqlserver-truststore.p12
        read_only: true
        bind:
          create_host_path: false
    ports:
      - 127.0.0.1:${CDC_CONNECT_PORT:-8083}:8083
    depends_on:
      cdc-kafka:
        condition: service_healthy
    healthcheck:
      test: [CMD-SHELL, 'curl -fsS http://localhost:8083/connectors >/dev/null']
      interval: 10s
      timeout: 5s
      retries: 30

  # topic/lagとconnector/taskを確認する管理UI。業務変換の編集画面ではない。
  # Connectのhealthyを待ち、hostへはloopbackからのみ接続できる。
  cdc-ui:
    profiles: [cdc]
    image: ghcr.io/kafbat/kafka-ui:v1.5.0@sha256:7cda86a33344160309fdb65146332e4da65db81a945614f2fe32e210803f6fd1
    restart: unless-stopped
    labels: *cdc_labels
    logging: *cdc_logging
    mem_limit: 512m
    environment:
      JAVA_OPTS: -Xms128m -Xmx384m
      KAFKA_CLUSTERS_0_NAME: factory-cdc
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: cdc-kafka:9092
      KAFKA_CLUSTERS_0_KAFKACONNECT_0_NAME: sqlserver-capture
      KAFKA_CLUSTERS_0_KAFKACONNECT_0_ADDRESS: http://cdc-connect:8083
      DYNAMIC_CONFIG_ENABLED: 'false'
    ports:
      - 127.0.0.1:${CDC_UI_PORT:-8084}:8080
    depends_on:
      cdc-connect:
        condition: service_healthy

  # private mappingを読み、connectorを明示登録するone-shot。
  # 既存connectorの差分を自動更新しないため、設定変更は専用手順で判断する。
  cdc-register:
    user: "${WORKER_UID:-10001}:${WORKER_GID:-10001}"
    profiles: [cdc]
    image: ${COMPOSE_PROJECT_NAME:-lakehouse}-cdc:local
    build:
      secrets:
        - corporate_ca
      context: ../..
      dockerfile: infra/cdc/Dockerfile
      args:
        CDC_UID: ${WORKER_UID:-10001}
        CDC_GID: ${WORKER_GID:-10001}
        HTTP_PROXY: ${HTTP_PROXY:-}
        HTTPS_PROXY: ${HTTPS_PROXY:-}
        NO_PROXY: *effective_no_proxy
        http_proxy: ${http_proxy:-}
        https_proxy: ${https_proxy:-}
        no_proxy: *effective_no_proxy
    restart: 'no'
    labels: *cdc_labels
    logging: *cdc_logging
    mem_limit: 256m
    environment:
      <<: [*cdc_environment, *fixed_cdc_identity]
    command: [python, /opt/lakehouse/cdc/connector.py]
    volumes:
      - *source_ca_mount
      - type: bind
        source: ${CDC_CONFIG_DIR:-/srv/lakehouse/cdc}
        target: /run/cdc
        read_only: true
        bind:
          create_host_path: false
    depends_on:
      cdc-connect:
        condition: service_healthy

  # raw履歴→SQLite現在値→CDC用Bronze/Silver/Gold→checkpoint→offsetの順に反映する。
  # 各保存は独立commit。Kafka履歴・state volume・mappingを揃えて再開する。
  # restart=noにより失敗時は停止して状態を確認し、理由を調べてから再開する。
  cdc-consumer:
    user: "${WORKER_UID:-10001}:${WORKER_GID:-10001}"
    profiles: [cdc]
    image: ${COMPOSE_PROJECT_NAME:-lakehouse}-cdc:local
    restart: 'no'
    labels: *cdc_labels
    logging: *cdc_logging
    mem_limit: 1024m
    cpus: 2
    # 内部の認証付きstatus/rebuild API。hostへportを公開しない。
    expose: ['8001']
    healthcheck:
      # HTTP制御面の生存確認。取込成功・lagゼロ・SQL整合性の証明ではない。
      test: [CMD, python, /opt/lakehouse/cdc/health.py]
      interval: 10s
      timeout: 5s
      retries: 3
    environment:
      <<: [*cdc_environment, *fixed_cdc_identity]
      S3_ACCESS_KEY: ${S3_ACCESS_KEY}
      S3_SECRET_KEY: ${S3_SECRET_KEY}
      S3_BUCKET_RAW: ${S3_BUCKET_RAW}
      S3_BUCKET_WAREHOUSE: ${S3_BUCKET_WAREHOUSE}
      WAREHOUSE_NAME: ${WAREHOUSE_NAME}
      WORKER_TOKEN: ${WORKER_TOKEN}
      NO_PROXY: *effective_no_proxy
      no_proxy: *effective_no_proxy
    volumes:
      - cdc-state:/state
      - *source_ca_mount
      - type: bind
        source: ${CDC_CONFIG_DIR:-/srv/lakehouse/cdc}
        target: /run/cdc
        read_only: true
        bind:
          create_host_path: false
    depends_on:
      worker:
        condition: service_healthy
      cdc-register:
        condition: service_completed_successfully
      catalog:
        condition: service_healthy
      trino:
        condition: service_healthy

# Kafka履歴とSQLite現在値/checkpointは別の状態。片方だけを初期化しない。
volumes:
  cdc-kafka:
    name: ${DATA_VOLUME_PREFIX:-${COMPOSE_PROJECT_NAME:-lakehouse}}_cdc-kafka
  cdc-state:
    name: ${CDC_STATE_VOLUME_NAME:-${DATA_VOLUME_PREFIX:-${COMPOSE_PROJECT_NAME:-lakehouse}}_cdc-state}
