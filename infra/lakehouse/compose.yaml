# 役割: 単一ホストPoCの保存・catalog・SQL・取込をまとめるcore構成。
# 入力はGit外のsite設定と完成したlanding素材、保存先はS3互換storageとIceberg。
# SQL Server本体・Dokploy・Sambaは別の管理領域。このComposeから導入しない。
# 読む順序: 共通anchor → catalog-db/storage → migrate/catalog → trino/worker。
# automation(n8n)とmonitoringは必要なprofileだけ有効化する。
# 公開portの既定はloopback。traefik.enable=falseのためHTTPS入口は別途設計する。

# 内部service名をproxy対象から除外し、社内proxyへ内部要求を送らない。
# 同じ除外値を大文字/小文字の両方へ渡し、利用libraryの違いを吸収する。
x-effective-no-proxy: &effective_no_proxy "${LAKEHOUSE_NO_PROXY:-localhost,127.0.0.1,::1,storage,catalog,catalog-db,trino,worker,catalog-migrate,n8n-db,n8n,prometheus,grafana,node-exporter,cadvisor,spark-volumes-init,spark-master,spark-worker,spark-history,spark-check,airflow-db,airflow,demo-api,demo,cdc-kafka,cdc-connect,cdc-ui,cdc-register,cdc-consumer,superset-db,superset-redis,superset-init,superset,jupyter,qdrant,marquez-db,marquez,marquez-web,mcp,dokploy,dokploy-postgres,dokploy-traefik,${NO_PROXY:-},${no_proxy:-}}"

name: ${COMPOSE_PROJECT_NAME:-lakehouse}

# 全serviceに10MiB×3世代のログ回転を共通適用し、ログの際限ない増加を抑える。
# x-*はYAMLの共通定義で、このブロック自体からコンテナは起動しない。
x-logging: &service_logging
  driver: json-file
  options:
    max-size: 10m
    max-file: '3'

# 移行と常駐catalogで同じDB・暗号鍵を使い、別metadataへ接続する食い違いを防ぐ。
x-catalog-environment: &catalog_environment
  LAKEKEEPER__PG_ENCRYPTION_KEY: ${CATALOG_ENCRYPTION_KEY:?Generate private site settings}
  LAKEKEEPER__PG_DATABASE_URL_READ: postgresql://lakekeeper:${CATALOG_DB_PASSWORD}@catalog-db:5432/lakekeeper
  LAKEKEEPER__PG_DATABASE_URL_WRITE: postgresql://lakekeeper:${CATALOG_DB_PASSWORD}@catalog-db:5432/lakekeeper
  LAKEKEEPER__BASE_URI: http://catalog:8181
  LAKEKEEPER__AUTHZ_BACKEND: allowall
  RUST_LOG: info

services:

  # catalogのmetadataを永続化するDB。実データ本体はstorage側にある。
  # DBだけのbackupではIceberg全体は戻らないため、storageと鍵を揃えて保管する。
  catalog-db:
    restart: unless-stopped
    labels:
      app.owner: lakehouse-foundation
      traefik.enable: 'false'
    logging: *service_logging
    image: docker.io/library/postgres:18.6-alpine@sha256:300ebd02c6d4de9ee27ad7f6855d5d21b4d3a4a5117767c1197d284c635d9736
    mem_limit: 512m
    environment:
      POSTGRES_DB: lakekeeper
      POSTGRES_USER: lakekeeper
      POSTGRES_PASSWORD: ${CATALOG_DB_PASSWORD:?Generate private site settings}
    volumes:
      - catalog-db:/var/lib/postgresql
    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U lakekeeper -d lakekeeper
      interval: 5s
      timeout: 3s
      retries: 30

  # 原本とIcebergデータを保存するS3互換層。認証設定は外部変数から組み立てる。
  # catalogは表の位置を管理し、このvolumeは表の実ファイルを保持する。
  storage:
    restart: unless-stopped
    labels:
      app.owner: lakehouse-foundation
      traefik.enable: 'false'
    logging: *service_logging
    image: docker.io/chrislusf/seaweedfs:4.53@sha256:972ba30c529dfc72a6a12ed427e94d99c7b6a6e59d97bfa52be0a849f43e2cc9
    mem_limit: 768m
    command:
      - server
      - -dir=/data
      - -ip=storage
      - -ip.bind=0.0.0.0
      - -volume.max=16
      - -master.volumeSizeLimitMB=1024
      - -filer
      - -s3
      - -s3.config=/etc/seaweedfs/s3.json
    volumes:
      - storage:/data
    configs:
      - source: s3-credentials
        target: /etc/seaweedfs/s3.json
      - source: filer-config
        target: /etc/seaweedfs/filer.toml
    ports:
      - ${BIND_IP:-127.0.0.1}:${S3_PORT:-8333}:8333

  # DBがhealthyになってからschemaを移行するone-shot。終了0が後段の起動条件。
  # 常駐サービスではないため、成功後のExited(0)は正常な状態。
  catalog-migrate:
    restart: 'no'
    labels:
      app.owner: lakehouse-foundation
      traefik.enable: 'false'
    logging: *service_logging
    image: quay.io/lakekeeper/catalog:v0.14.3@sha256:0009e7ccb26db811b8fc485974b624a999fd096f4da549a8704d3121dc20e98a
    mem_limit: 256m
    environment: *catalog_environment
    command:
      - migrate
    depends_on:
      catalog-db:
        condition: service_healthy

  # Iceberg REST catalogを提供し、移行が正常完了してから起動する。
  # allowallは限定PoCの設定。利用者ごとの認可をこの定義だけで提供するものではない。
  catalog:
    restart: unless-stopped
    labels:
      app.owner: lakehouse-foundation
      traefik.enable: 'false'
    logging: *service_logging
    image: quay.io/lakekeeper/catalog:v0.14.3@sha256:0009e7ccb26db811b8fc485974b624a999fd096f4da549a8704d3121dc20e98a
    mem_limit: 384m
    environment: *catalog_environment
    command:
      - serve
    ports:
      - ${BIND_IP:-127.0.0.1}:${CATALOG_PORT:-8181}:8181
    depends_on:
      catalog-migrate:
        condition: service_completed_successfully
    healthcheck:
      test:
        - CMD
        - /home/nonroot/lakekeeper
        - healthcheck
      interval: 10s
      timeout: 5s
      retries: 30

  # Silver/GoldのSQL変換と参照を担当し、catalogのhealthyを待つ。
  # warehouse名・S3認証・catalog設定をworkerと揃え、別の保存先を参照しないようにする。
  trino:
    restart: unless-stopped
    labels:
      app.owner: lakehouse-foundation
      traefik.enable: 'false'
    logging: *service_logging
    image: docker.io/trinodb/trino:484@sha256:2704eb53935af5e582d63d6033e9bf99d20c325e9b0e30b1016ef59a4773979f
    mem_limit: 1536m
    cpus: 2
    environment:
      NO_PROXY: *effective_no_proxy
      no_proxy: *effective_no_proxy
      S3_ACCESS_KEY: ${S3_ACCESS_KEY}
      S3_SECRET_KEY: ${S3_SECRET_KEY}
      WAREHOUSE_NAME: ${WAREHOUSE_NAME}
    configs:
      - source: trino-config
        target: /etc/trino/config.properties
      - source: trino-jvm
        target: /etc/trino/jvm.config
      - source: trino-node
        target: /etc/trino/node.properties
      - source: trino-iceberg
        target: /etc/trino/catalog/iceberg.properties
    volumes:
      - trino:/data/trino
    ports:
      - ${BIND_IP:-127.0.0.1}:${TRINO_PORT:-8080}:8080
    depends_on:
      catalog:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - /usr/lib/trino/bin/health-check
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 30s

  # 完成したlanding素材を読み、原本保存・Bronze取込・登録SQLの実行を担当する。
  # landingは読取専用bind。素材を作る権限はdemo-api側へ分ける。
  # 公開host portは設けず、同じprojectのGUI/自動化から認証付き内部APIを呼ぶ。
  worker:
    # landingの所有者UID/GIDで動かし、既存ディレクトリの権限を勝手に変更しない。
    user: "${WORKER_UID:?Set the landing reader UID}:${WORKER_GID:?Set the landing reader GID}"
    restart: unless-stopped
    labels:
      app.owner: lakehouse-foundation
      traefik.enable: 'false'
    logging: *service_logging
    # 環境別のtagにし、別projectのbuildで既存imageを取り違えないようにする。
    image: ${COMPOSE_PROJECT_NAME:-lakehouse}-worker:local
    # Rebuild this local tag through its single owner; retain build cache.
    pull_policy: build
    build:
      secrets:
        - corporate_ca
      context: ../..
      dockerfile: infra/lakehouse/Dockerfile
      args:
        HTTP_PROXY: ${HTTP_PROXY:-}
        HTTPS_PROXY: ${HTTPS_PROXY:-}
        NO_PROXY: *effective_no_proxy
        http_proxy: ${http_proxy:-}
        https_proxy: ${https_proxy:-}
        no_proxy: *effective_no_proxy
    mem_limit: 1024m
    cpus: 2
    environment:
      S3_ACCESS_KEY: ${S3_ACCESS_KEY}
      S3_SECRET_KEY: ${S3_SECRET_KEY}
      S3_BUCKET_RAW: ${S3_BUCKET_RAW}
      S3_BUCKET_WAREHOUSE: ${S3_BUCKET_WAREHOUSE}
      WAREHOUSE_NAME: ${WAREHOUSE_NAME}
      WORKER_TOKEN: ${WORKER_TOKEN}
      HTTP_PROXY: ${HTTP_PROXY:-}
      HTTPS_PROXY: ${HTTPS_PROXY:-}
      NO_PROXY: *effective_no_proxy
      http_proxy: ${http_proxy:-}
      https_proxy: ${https_proxy:-}
      no_proxy: *effective_no_proxy
    volumes:
      - type: bind
        source: ${LANDING_DIR:?Set the external landing directory}
        target: /landing
        read_only: true
        bind:
          create_host_path: false
    depends_on:
      catalog:
        condition: service_healthy
      storage:
        condition: service_started
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - import urllib.request; urllib.request.urlopen("http://127.0.0.1:8000/health",timeout=3)
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 30s

  # automation専用DB。workflow/credentialをcatalogのmetadataから分離して保存する。
  n8n-db:
    restart: unless-stopped
    labels:
      app.owner: lakehouse-foundation
      traefik.enable: 'false'
    logging: *service_logging
    image: docker.io/library/postgres:18.6-alpine@sha256:300ebd02c6d4de9ee27ad7f6855d5d21b4d3a4a5117767c1197d284c635d9736
    profiles: [automation]
    mem_limit: 384m
    environment:
      POSTGRES_DB: n8n
      POSTGRES_USER: n8n
      POSTGRES_PASSWORD: ${N8N_DB_PASSWORD}
    volumes:
      - n8n-db:/var/lib/postgresql
    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U n8n -d n8n
      interval: 5s
      timeout: 3s
      retries: 30

  # 画面でworkerへの実行手順を組む。列変換の正本はGitのSQLに残す。
  # DBとN8N_ENCRYPTION_KEYを一組で保持し、更新時に鍵だけを作り直さない。
  n8n:
    restart: unless-stopped
    labels:
      app.owner: lakehouse-foundation
      traefik.enable: 'false'
    logging: *service_logging
    image: docker.n8n.io/n8nio/n8n:2.46.7@sha256:6102ca27d9392c7f4778c0a35a80834d6620a365ab4d546a9fdf855a2b52fe4e
    profiles: [automation]
    mem_limit: 1024m
    environment:
      DB_TYPE: postgresdb
      DB_POSTGRESDB_HOST: n8n-db
      DB_POSTGRESDB_PORT: '5432'
      DB_POSTGRESDB_DATABASE: n8n
      DB_POSTGRESDB_USER: n8n
      DB_POSTGRESDB_PASSWORD: ${N8N_DB_PASSWORD}
      N8N_ENCRYPTION_KEY: ${N8N_ENCRYPTION_KEY}
      N8N_HOST: ${N8N_HOST:-localhost}
      N8N_PORT: '5678'
      N8N_PROTOCOL: ${N8N_PROTOCOL:-http}
      N8N_SECURE_COOKIE: ${N8N_SECURE_COOKIE:-true}
      # 同梱workflowに必要な内部宛先はworkerだけ。許可を広げる前にSSRF.mdを確認する。
      N8N_SSRF_PROTECTION_ENABLED: ${N8N_SSRF_PROTECTION_ENABLED:-true}
      N8N_SSRF_BLOCKED_IP_RANGES: ${N8N_SSRF_BLOCKED_IP_RANGES:-default,100.64.0.0/10}
      N8N_SSRF_ALLOWED_IP_RANGES: ${N8N_SSRF_ALLOWED_IP_RANGES:-}
      N8N_SSRF_ALLOWED_HOSTNAMES: ${N8N_SSRF_ALLOWED_HOSTNAMES-worker}
      N8N_SSRF_BLOCKED_HOSTNAMES: ${N8N_SSRF_BLOCKED_HOSTNAMES:-}
      N8N_SSRF_DNS_CACHE_MAX_SIZE: ${N8N_SSRF_DNS_CACHE_MAX_SIZE:-1048576}
      N8N_DIAGNOSTICS_ENABLED: 'false'
      N8N_PERSONALIZATION_ENABLED: 'false'
      N8N_VERSION_NOTIFICATIONS_ENABLED: 'false'
      N8N_ENFORCE_SETTINGS_FILE_PERMISSIONS: 'true'
      N8N_BLOCK_ENV_ACCESS_IN_NODE: 'true'
      GENERIC_TIMEZONE: Asia/Tokyo
      EXECUTIONS_DATA_PRUNE: 'true'
      EXECUTIONS_DATA_MAX_AGE: '168'
      # CA未設定時は空とし、Node標準の公開root証明書を引き続き使う。
      NODE_EXTRA_CA_CERTS: ${CORPORATE_CA_FILE:+/etc/n8n/corporate-ca.pem}
      HTTP_PROXY: ${HTTP_PROXY:-}
      HTTPS_PROXY: ${HTTPS_PROXY:-}
      NO_PROXY: *effective_no_proxy
      http_proxy: ${http_proxy:-}
      https_proxy: ${https_proxy:-}
      no_proxy: *effective_no_proxy
    volumes:
      - n8n:/home/node/.n8n
      # ここに渡すのはCAの公開証明書だけ。秘密鍵やsite設定ディレクトリはmountしない。
      - type: bind
        source: ${CORPORATE_CA_FILE:-../../infra/proxy/empty-ca.pem}
        target: /etc/n8n/corporate-ca.pem
        read_only: true
        bind:
          create_host_path: false
    ports:
      - ${BIND_IP:-127.0.0.1}:${N8N_PORT:-5678}:5678
    depends_on:
      n8n-db:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - fetch("http://127.0.0.1:5678/healthz").then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))
      interval: 15s
      timeout: 5s
      retries: 30

  # 既存のworker/self収集を維持し、承認後にhost/container exporterを追加する。
  # exporter停止でもPrometheus自身は起動する。15日/2GBの保持上限は維持する。
  prometheus:
    restart: unless-stopped
    labels:
      app.owner: lakehouse-foundation
      traefik.enable: 'false'
    logging: *service_logging
    image: prom/prometheus:v3.16.0@sha256:89c1a644817e9ad70fa2af76c84898e327c1de7063735f962e8313b1e28672c3
    profiles: [monitoring]
    mem_limit: 384m
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=15d
      - --storage.tsdb.retention.size=2GB
    configs:
      - source: prometheus-config
        target: /etc/prometheus/prometheus.yml
      - source: monitoring-rules
        target: /etc/prometheus/rules/foundation.yml
    volumes:
      - prometheus:/prometheus
    ports:
      - ${BIND_IP:-127.0.0.1}:${PROMETHEUS_PORT:-9090}:9090

  # datasourceだけをprovisionし、dashboardの正本はGUIで保存した内容にする。
  # grafana volumeに編集結果を残すため、再配置とvolume削除は分けて扱う。
  grafana:
    restart: unless-stopped
    labels:
      app.owner: lakehouse-foundation
      traefik.enable: 'false'
    logging: *service_logging
    image: grafana/grafana:13.3.0@sha256:6e5d306338670f381a942f1c50d3c266bf71531e5ddd9ee4fc1a133dac5ce63d
    profiles: [monitoring]
    mem_limit: 384m
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD}
      GF_USERS_ALLOW_SIGN_UP: 'false'
      GF_AUTH_ANONYMOUS_ENABLED: 'false'
      GF_ANALYTICS_REPORTING_ENABLED: 'false'
      GF_ANALYTICS_CHECK_FOR_UPDATES: 'false'
      # 標準dashboardは組込み機能だけを使う。外部pluginの取得は管理者の別作業。
      GF_ANALYTICS_CHECK_FOR_PLUGIN_UPDATES: 'false'
      GF_PLUGINS_PREINSTALL_DISABLED: 'true'
      GF_PLUGINS_PREINSTALL_AUTO_UPDATE: 'false'
      GF_PLUGINS_PLUGIN_ADMIN_ENABLED: 'false'
    configs:
      - source: grafana-datasource
        target: /etc/grafana/provisioning/datasources/prometheus.yml
    volumes:
      - grafana:/var/lib/grafana
    ports:
      - ${BIND_IP:-127.0.0.1}:${GRAFANA_PORT:-3000}:3000

  # host root/proc/sysの読取りを追加するため、既存monitoring利用者も配置前に承認する。
  # netlinkや/proc/netがcontainer netnsを示す問題を避け、ネットワーク/TCPは未提供。
  # D-Bus・host network・追加capabilityは渡さない。systemd collectorは無効。
  node-exporter:
    image: ghcr.io/prometheus/node-exporter:v1.12.1@sha256:1b4e4438faca4dd7e001dd445d161a4a2091b0fededa84093b3a8dfeae1f1be0
    profiles: [monitoring]
    restart: unless-stopped
    mem_limit: 128m
    cpus: 0.5
    user: '65534:65534'
    pid: host
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    logging: *service_logging
    labels:
      app.owner: lakehouse-foundation
      traefik.enable: 'false'
    command:
      - --path.rootfs=/host
      - --path.procfs=/host/proc
      - --path.sysfs=/host/sys
      - --collector.disable-defaults
      - --collector.cpu
      - --collector.loadavg
      - --collector.meminfo
      - --collector.vmstat
      - --collector.filesystem
      - --collector.diskstats
      - --collector.time
      - --collector.stat
      - --collector.uname
      - --collector.processes
      - --web.listen-address=:9100
    volumes:
      - type: bind
        source: /
        target: /host
        read_only: true
        bind:
          propagation: rslave
          create_host_path: false
    # BusyBox/wgetの存在は公式Dockerfileに基づく。実imageでのprobeは未実施。
    healthcheck:
      test: [CMD, /bin/wget, -q, -T, '4', -O, /dev/null, 'http://127.0.0.1:9100/metrics']
      interval: 30s
      timeout: 5s
      retries: 3

  # socket-freeで見えるcgroup指標だけを収集する。Docker metadata/labelは実機受入が必要。
  # DockerRootDirはoperatorが確認した絶対パスをprivate設定へ指定する。既定値を推測しない。
  cadvisor:
    image: ghcr.io/google/cadvisor:v0.60.6@sha256:b8e7d1093144fd088f425ff003d75a4aa405de075db78dae3bc563730b1bd07a
    profiles: [monitoring]
    restart: unless-stopped
    mem_limit: 256m
    cpus: 0.5
    user: '65534:65534'
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    logging: *service_logging
    labels:
      app.owner: lakehouse-foundation
      traefik.enable: 'false'
    command:
      - --docker_only=false
      - --housekeeping_interval=15s
      - --store_container_labels=false
      - --whitelisted_container_labels=com.docker.compose.project,com.docker.compose.service,app.owner
    volumes:
      - type: bind
        source: /
        target: /rootfs
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: /sys
        target: /sys
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: ${CADVISOR_DOCKER_DATA_ROOT:-../monitoring/empty-docker-root}
        target: /var/lib/docker
        read_only: true
        bind:
          create_host_path: false
    healthcheck:
      test: [CMD, /usr/bin/healthcheck.sh]
      interval: 30s
      timeout: 5s
      retries: 3

# configは起動時の設定配布。S3認証を含む展開結果を公開ログやGitへ保存しない。
configs:
  monitoring-rules:
    file: ../monitoring/rules/foundation.yml
  s3-credentials:
    content: |-
      {
        "identities": [
          {
            "name": "lakehouse",
            "credentials": [
              {
                "accessKey": "${S3_ACCESS_KEY}",
                "secretKey": "${S3_SECRET_KEY}"
              }
            ],
            "actions": [
              "Admin",
              "Read",
              "Write",
              "List",
              "Tagging"
            ]
          }
        ]
      }
  filer-config:
    content: |
      [leveldb2]
      enabled = true
      dir = "/data/filer"
  trino-config:
    file: ./config.properties
  trino-jvm:
    file: ./jvm.config
  trino-node:
    file: ./node.properties
  trino-iceberg:
    file: ./iceberg.properties
  prometheus-config:
    file: ../monitoring/prometheus.yml
  grafana-datasource:
    file: ../monitoring/grafana-datasource.yml

# 保存先名はprojectを基準に分離する。既存volumeを引き継ぐ場合だけ別prefixを指定する。
# DB・object・GUI状態を保持するvolumeで、ソース更新だけでは削除しない。
volumes:
  # 通常は空のまま。既存のvolume名を保持する移行時だけDATA_VOLUME_PREFIXを指定する。
  catalog-db:
    name: ${DATA_VOLUME_PREFIX:-${COMPOSE_PROJECT_NAME:-lakehouse}}_catalog-db
  storage:
    name: ${DATA_VOLUME_PREFIX:-${COMPOSE_PROJECT_NAME:-lakehouse}}_storage
  trino:
    name: ${DATA_VOLUME_PREFIX:-${COMPOSE_PROJECT_NAME:-lakehouse}}_trino
  n8n-db:
    name: ${DATA_VOLUME_PREFIX:-${COMPOSE_PROJECT_NAME:-lakehouse}}_n8n-db
  n8n:
    name: ${DATA_VOLUME_PREFIX:-${COMPOSE_PROJECT_NAME:-lakehouse}}_n8n
  prometheus:
    name: ${DATA_VOLUME_PREFIX:-${COMPOSE_PROJECT_NAME:-lakehouse}}_prometheus
  grafana:
    name: ${DATA_VOLUME_PREFIX:-${COMPOSE_PROJECT_NAME:-lakehouse}}_grafana

# build時の社内CA受渡し。未設定時は空の公開placeholderで、秘密鍵は渡さない。
