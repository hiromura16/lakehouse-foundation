# 役割: compute profileでSpark master/worker/historyを常駐させる追加構成。
# coreの後に同じprojectへ結合する。ファイル取込・Silver/Goldの通常処理はcore側。
# 読む順序: 共通image/daemon → volume初期化 → master → worker → history。
# notebooksだけでもvolume初期化は使える。spark-checkは明示実行用で常駐しない。
# UIのhost公開はloopback固定、実行RPCはCompose内にとどめる。

# 内部service名をproxy対象から除外し、社内proxyへ内部要求を送らない。
# 同じ除外値を大文字/小文字の両方へ渡し、利用libraryの違いを吸収する。
x-effective-no-proxy: &effective_no_proxy "${LAKEHOUSE_NO_PROXY:-localhost,127.0.0.1,::1,storage,catalog,catalog-db,trino,worker,catalog-migrate,n8n-db,n8n,prometheus,grafana,node-exporter,cadvisor,spark-volumes-init,spark-master,spark-worker,spark-history,spark-check,airflow-db,airflow,demo-api,demo,cdc-kafka,cdc-connect,cdc-ui,cdc-register,cdc-consumer,superset-db,superset-redis,superset-init,superset,jupyter,qdrant,marquez-db,marquez,marquez-web,mcp,dokploy,dokploy-postgres,dokploy-traefik,${NO_PROXY:-},${no_proxy:-}}"

# master/worker/history/smokeを同じ固定Spark/Iceberg imageへ揃える共通定義。
x-spark-image: &spark_image
  image: ${COMPOSE_PROJECT_NAME:-lakehouse}-spark-check:local
  # All consumers reuse the tag; only spark-volumes-init owns its build.
  pull_policy: never
# Dokploy等の所有者識別とTraefikの自動公開を分ける共通label。
x-spark-labels: &spark_labels
  app.owner: lakehouse-foundation
  traefik.enable: 'false'
# JVMのログも回転させ、event log用volumeと標準出力ログの保管を分ける。
x-spark-logging: &spark_logging
  driver: json-file
  options:
    max-size: 10m
    max-file: '3'
# 外向きHTTPのproxyと内部通信の除外を揃え、daemonのJVMメモリも明示する。
x-spark-environment: &spark_environment
  HTTP_PROXY: ${HTTP_PROXY:-}
  HTTPS_PROXY: ${HTTPS_PROXY:-}
  NO_PROXY: *effective_no_proxy
  http_proxy: ${http_proxy:-}
  https_proxy: ${https_proxy:-}
  no_proxy: *effective_no_proxy
  SPARK_DAEMON_MEMORY: 512m
  SPARK_LOG_DIR: /opt/spark/work/logs
# 常駐3roleの非root権限・終了処理・共有volumeを揃えるanchor。
# execでJVMを前面起動し、コンテナ停止をdaemon停止へ伝える。
x-spark-daemon: &spark_daemon
  <<: *spark_image
  profiles: [compute]
  user: "${WORKER_UID:-10001}:${WORKER_GID:-10001}"
  init: true
  restart: unless-stopped
  labels: *spark_labels
  logging: *spark_logging
  cap_drop: [ALL]
  security_opt: [no-new-privileges:true]
  # image既定のKubernetes向け入口を置き換え、JVMを前面で動かして停止通知を受ける。
  entrypoint: [python3, /opt/lakehouse/spark_cluster.py]
  stop_grace_period: 30s
  volumes:
    - spark-events:/opt/spark/events
    - spark-work:/opt/spark/work

services:
  # 2つの専用volumeルートだけの所有者とmodeを準備するone-shot。
  # root権限はこの処理に限定し、既存ファイルへの再帰chownは行わない。
  # 同じbuild tagをdaemonとsmokeへ渡し、Spark/Icebergの組合せを揃える。
  spark-volumes-init:
    <<: *spark_image
    pull_policy: build
    build:
      secrets: [corporate_ca]
      context: ../..
      dockerfile: infra/compute/Dockerfile
      args:
        SPARK_UID: ${WORKER_UID:-10001}
        SPARK_GID: ${WORKER_GID:-10001}
        HTTP_PROXY: ${HTTP_PROXY:-}
        HTTPS_PROXY: ${HTTPS_PROXY:-}
        NO_PROXY: *effective_no_proxy
        http_proxy: ${http_proxy:-}
        https_proxy: ${https_proxy:-}
        no_proxy: *effective_no_proxy
    profiles: [compute, notebooks]
    user: '0:0'
    restart: 'no'
    labels: *spark_labels
    logging: *spark_logging
    cap_drop: [ALL]
    cap_add: [CHOWN, FOWNER]
    security_opt: [no-new-privileges:true]
    mem_limit: 128m
    environment:
      WORKER_UID: ${WORKER_UID:-10001}
      WORKER_GID: ${WORKER_GID:-10001}
    entrypoint: [python3, /opt/lakehouse/spark_cluster.py]
    command: [init]
    volumes:
      - spark-events:/opt/spark/events
      - spark-work:/opt/spark/work
    healthcheck:
      disable: true

  # workerの登録と実行資源を管理する。volume初期化の終了0を待って起動する。
  # 7077(RPC)は内部だけ、Web UIだけをhostのloopbackへ公開する。
  spark-master:
    <<: *spark_daemon
    hostname: spark-master
    mem_limit: 768m
    cpus: 1
    environment:
      <<: *spark_environment
      SPARK_LOCAL_HOSTNAME: spark-master
      SPARK_MASTER_OPTS: >-
        -Dspark.ui.reverseProxy=true
        -Dspark.ui.reverseProxyUrl=http://localhost:${SPARK_MASTER_UI_PORT:-8082}
        -Dspark.master.ui.historyServerUrl=http://localhost:${SPARK_HISTORY_UI_PORT:-18080}
        -Dspark.master.rest.enabled=false
        -Dspark.deploy.defaultCores=2
    command: [master]
    ports:
      - 127.0.0.1:${SPARK_MASTER_UI_PORT:-8082}:8080
    depends_on:
      spark-volumes-init:
        condition: service_completed_successfully
    healthcheck:
      test: [CMD, python3, /opt/lakehouse/spark_cluster.py, health, master]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 20s

  # 実際のexecutorを動かす。masterのhealthyとvolume初期化完了の両方を待つ。
  # 実行用2core/2GiBに加え、daemon等の余裕を含めたコンテナ上限を設ける。
  spark-worker:
    <<: *spark_daemon
    hostname: spark-worker
    mem_limit: 4g
    cpus: 2
    environment:
      <<: *spark_environment
      SPARK_LOCAL_HOSTNAME: spark-worker
      SPARK_WORKER_OPTS: >-
        -Dspark.ui.reverseProxy=true
        -Dspark.ui.reverseProxyUrl=http://localhost:${SPARK_MASTER_UI_PORT:-8082}
    command: [worker]
    ports:
      - 127.0.0.1:${SPARK_WORKER_UI_PORT:-8085}:8081
    depends_on:
      spark-volumes-init:
        condition: service_completed_successfully
      spark-master:
        condition: service_healthy
    healthcheck:
      test: [CMD, python3, /opt/lakehouse/spark_cluster.py, health, worker]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 20s

  # 保存済みevent logを再起動後も読み、終了したSpark処理の履歴を表示する。
  # eventの自動削除は無効。保存容量と保管期間は運用側で管理する。
  spark-history:
    <<: *spark_daemon
    hostname: spark-history
    mem_limit: 1g
    cpus: 1
    environment:
      <<: *spark_environment
      SPARK_LOCAL_HOSTNAME: spark-history
      SPARK_HISTORY_OPTS: >-
        -Dspark.history.fs.logDirectory=file:///opt/spark/events
        -Dspark.history.ui.port=18080
        -Dspark.history.store.path=/opt/spark/work/history
        -Dspark.history.retainedApplications=50
        -Dspark.history.fs.cleaner.enabled=false
    command: [history]
    ports:
      - 127.0.0.1:${SPARK_HISTORY_UI_PORT:-18080}:18080
    depends_on:
      spark-volumes-init:
        condition: service_completed_successfully
    healthcheck:
      test: [CMD, python3, /opt/lakehouse/spark_cluster.py, health, history]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 20s

  # local[2]の明示smoke。常駐clusterへ投入するテストとは区別する。
  # replicas=0なので通常upでは起動せず、必要時だけrunで読み書きを確かめる。
  spark-check:
    <<: *spark_image
    volumes:
      - spark-work:/opt/spark/work
    profiles: [compute]
    deploy:
      replicas: 0
    restart: 'no'
    labels: *spark_labels
    mem_limit: 2g
    cpus: 2
    environment:
      <<: *spark_environment
      S3_ACCESS_KEY: ${S3_ACCESS_KEY}
      S3_SECRET_KEY: ${S3_SECRET_KEY}
      WAREHOUSE_NAME: ${WAREHOUSE_NAME}
    command:
      - /opt/spark/bin/spark-submit
      - --master
      - local[2]
      - --driver-memory
      - 768m
      - /opt/lakehouse/spark_smoke.py
    logging: *spark_logging

# eventsは処理履歴、workは作業/索引の保存。初期化と各roleで同じvolume名を共有する。
volumes:
  spark-events:
    name: ${DATA_VOLUME_PREFIX:-${COMPOSE_PROJECT_NAME:-lakehouse}}_spark-events
  spark-work:
    name: ${DATA_VOLUME_PREFIX:-${COMPOSE_PROJECT_NAME:-lakehouse}}_spark-work
